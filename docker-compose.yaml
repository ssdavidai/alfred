# alfred-black — single-VM stack.
#
# `docker compose up -d` PULLS only — never builds. Every service references a
# published image tag. Custom images are built + pushed by CI
# (.github/workflows/build-*.yml); third-party images come from public
# registries.
#
# This file is the static, de-templated merge of:
#   * packages/ctrl/src/templates/docker-compose.yaml.njk  (the tenant stack)
#   * deploy/docker-compose.yaml                            (the Wasp web app)
# from alfred-platform. Nunjucks `{% if %}` → compose `profiles`; `{{ }}` →
# `${ENV}`; `/mnt/encrypted/*` bind mounts → named Docker volumes.
#
# Profiles:
#   * (default — no profile)  always-on services. `docker compose up -d`.
#
# Minimum VM spec: the default-profile `mem_limit` ceilings sum to ~37 GB, so
# 32 GB is below the hard cap and OOM-kills a container under load. Floor is
# 48 GB RAM (32 GB only survives a near-idle box); 48 GB recommended.
# Also: 4+ vCPU, 80+ GB disk.
#
# Host port bindings: only `caddy` (80/443). Every other service talks over
# the compose default network by service DNS (e.g. http://ctrl-api:3100).

name: alfred-black

# ── Log rotation (fleet-wide) ───────────────────────────────────────────────
# Docker's default json-file log driver has NO size cap, so a chatty container
# (e.g. the Hermes gateway in a stuck background-agent loop) can grow its
# `*-json.log` without bound until it fills the host disk. Live evidence
# (2026-06-19): per-container json.log of 19 G (rami), 5.4 G (rj), 3.4 G (joe),
# 7.2 G (miguel). This anchor caps every service at 5 files × 50 MB = 250 MB
# max per container and is attached to each service below via
# `logging: *default-logging`. It is the per-service equivalent of a host
# /etc/docker/daemon.json default — but it ships through the existing
# deploy-compose.yml sync, so it reaches every tenant the same way an image
# change does (no out-of-band per-host edit required).
x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ── Caddy — public ingress + automatic Let's Encrypt TLS ────────────
  caddy:
    logging: *default-logging
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Tailscale-issued certs (issue #109 PR 4). The /channels Tailscale
      # card's "Issue cert" button calls POST /api/v1/channels/tailscale/cert
      # which runs `tailscale cert <domain>` inside the sidecar and copies
      # the resulting `.crt` + `.key` into this directory. Caddy imports
      # snippets from /tailscale-snippets/*.caddy at load time (see the
      # `import` directive at the top of Caddyfile) — the cert route writes
      # one snippet per domain and then triggers `caddy reload` via
      # `docker exec`. The directory must exist on the host before compose
      # up (bootstrap.sh creates it); on a stock tenant the import is a
      # no-op because the glob matches zero files.
      - ./caddy/tailscale-certs:/tailscale-certs
      - ./caddy/tailscale-snippets:/tailscale-snippets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    # Bumped 256 -> 1024 on 2026-05-29. Caddy's runtime is small but every
    # operator `caddy validate` / `caddy reload` (e.g. ctrl-api's tailscale
    # cert route, an interactive shell-out during incident response, or the
    # deploy-compose.yml graceful-reload step) forks a fresh Go runtime —
    # which spawns ~30-50 OS threads per invocation. On home.alfred.black
    # the cap was hit live during HA wiring: `caddy reload` returned
    # `runtime: failed to create new OS thread; errno=11` (EAGAIN) and
    # every shell-out inside the container failed. 1024 is well clear of
    # the steady-state ~80-100 threads + room for concurrent reloads.
    pids_limit: 1024

  # ── web-db — Postgres for the Wasp web app (auth, ApiKey, OAuth) ────
  web-db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=alfred
      - POSTGRES_PASSWORD=${WEB_DATABASE_PASSWORD}
      - POSTGRES_DB=alfred_web
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - web_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfred -d alfred_web"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    pids_limit: 512

  # ── web — the Wasp dashboard (SPA + API server) ─────────────────────
  # Wasp runs `prisma migrate deploy` against web-db on container start.
  web:
    logging: *default-logging
    image: ssdavidai00/alfred-web:latest
    restart: unless-stopped
    depends_on:
      web-db:
        condition: service_healthy
      ctrl-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://alfred:${WEB_DATABASE_PASSWORD}@web-db:5432/alfred_web
      - PORT=3000
      - WASP_WEB_CLIENT_URL=https://${DOMAIN}
      # the server is reached on its own subdomain; the SPA (apex) calls it
      # cross-origin — WASP_WEB_CLIENT_URL above configures Wasp's CORS.
      - WASP_SERVER_URL=https://api.${DOMAIN}
      - JWT_SECRET=${JWT_SECRET}
      - CTRL_API_URL=http://ctrl-api:3100
      - AAS_API_KEY=${AAS_API_KEY}
      - COLUMN_ENCRYPTION_KEY=${COLUMN_ENCRYPTION_KEY}
    volumes:
      # read-only — the chat proxy reads /alfred-data/.gateway-token to
      # authenticate to the Hermes /v1 API.
      - alfred_data:/alfred-data:ro
    healthcheck:
      # the Wasp server image is slim (no wget/curl) and exposes no fixed
      # 200 route — a TCP-connect probe via the bundled Node is robust.
      test: ["CMD-SHELL", "node -e \"require('net').connect(3000,'127.0.0.1').on('connect',function(){process.exit(0)}).on('error',function(){process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    mem_limit: 2g
    pids_limit: 512

  # ── web-client — the Wasp React SPA (static, nginx) ─────────────────
  # `wasp build` emits the client separately from the server; this nginx
  # image serves the static bundle with SPA history-fallback. Caddy routes
  # the apex domain here and api.<domain> to the `web` server.
  web-client:
    logging: *default-logging
    image: ssdavidai00/alfred-web-client:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    environment:
      # baked into the SPA bundle at container start (replaces the
      # __ALFRED_API_URL__ placeholder) — must match the api subdomain.
      - WASP_SERVER_URL=https://api.${DOMAIN}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 128m
    pids_limit: 256

  # ── init — one-shot bootstrap gate ──────────────────────────────────
  # Scaffolds the vault, deploys skills + the MCP bundle, renders Hermes
  # profile configs, writes /alfred-data/.gateway-token. Every long-running
  # service that needs a scaffolded vault/config gates on this completing.
  init:
    logging: *default-logging
    image: ssdavidai00/alfred-init:latest
    restart: "no"
    volumes:
      - vault_data:/vault
      - hermes_data:/hermes-state
      - alfred_data:/alfred-data
      # codex-builder workspace mount — init chowns it to 10001:10001 mode
      # 0700 (PR 4 of docs/codex-builder-runtime.md §6) so the codex-builder
      # gateway can mkdir /work/runs/<runId>/. NOT mounted in any other
      # compose service (paperclip / ctrl-api / web / alfred) — the run
      # data is invisible to the rest of the stack. See the hermes service
      # volumes for the matching mount on the consumer side.
      - hermes_codex_work:/work
      # Phase B — runtime-flippable tool dispositions. The init container's
      # render_mcp_servers.py reads state.db.tool_disposition READ-ONLY to
      # decide which MCP servers on main get `tools.include: []`. ctrl-api
      # remains the SOLE writer; this mount is :ro so the init container
      # can never accidentally write to the single-writer DB. On a fresh
      # tenant the file doesn't yet exist — the mutator falls back to
      # all-direct (matching the migration seed) so init never blocks on
      # this signal.
      - state_data:/ctrl-data:ro
    env_file:
      - .env
    environment:
      # hermes_data is mounted at /hermes-state; the init container writes
      # the rendered Hermes profile configs under /hermes-state/profiles/<p>/
      # and the hermes runtime sees the same volume at the same path.
      - HERMES_DATA_DIR=/hermes-state
      - HERMES_RUNTIME_HOME=/hermes-state
      # Phase B — path to ctrl-api's state.db for the disposition reader.
      # The mount above lands the volume at /ctrl-data; the DB lives at
      # /ctrl-data/alfred-state.db (matching ctrl-api's STATE_DB_PATH
      # default of /state/alfred-state.db). Best-effort: render_mcp_servers
      # gracefully degrades if the file or table is missing.
      - STATE_DB_PATH=/ctrl-data/alfred-state.db
      # init step 9 seeds the sender allowlist + stages the Sure/owner email
      # files from OWNER_EMAIL. env_file already injects it, but pin it
      # explicitly so the canonical name is unambiguous at this boundary (C9).
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      # codex-builder hardening (PR 4 of docs/codex-builder-runtime.md §6).
      # When the flag is on, init step 7b chowns the codex-builder profile
      # dir + /work to 10001:10001 mode 0700, writes the deploy key, and
      # runs the negative-assert spot-checks (uid 10001 cannot read /vault,
      # /alfred-data, other-profile .env files). When off, the chowns
      # still happen but the asserts are skipped — flipping the flag on
      # later does not require a chown sweep.
      - ENABLE_CODEX_BUILDER=${ENABLE_CODEX_BUILDER:-false}
      # Base64-encoded private SSH key for the GitHub deploy key on
      # ssdavidai/alfred (repo-scoped, write-enabled). When set, init
      # writes it to /hermes-state/profiles/codex-builder/.ssh/codex_id_ed25519
      # owned 10001:10001 mode 0600. When empty (default everywhere except
      # home), no key is written and PR 5's wrapper emits a clean
      # "deploy key missing" run audit if git push is attempted.
      - CODEX_BUILDER_DEPLOY_KEY_B64=${CODEX_BUILDER_DEPLOY_KEY_B64:-}

  # ── temporal — workflow engine for alfred-learn ─────────────────────
  temporal:
    logging: *default-logging
    # blobSize / historySize bumps from defaults (2MB warn / 4MB error blob,
    # 50MB / 50K events history) up to 16MB / 8MB blob and 200MB / 100K
    # history — driven by composio_pull returning full-HTML Gmail bodies
    # that hit Temporal's 4MB blob limit on a busy mailbox.
    image: temporalio/temporal:latest
    # start-dev writes its SQLite DB to the temporal_data volume; Docker
    # creates named volumes root-owned, and the image's default user cannot
    # write there (SQLITE_CANTOPEN). Run as root so the DB file is created.
    user: "0:0"
    command:
      - "server"
      - "start-dev"
      - "--db-filename"
      - "/data/temporal.db"
      - "--ip"
      - "0.0.0.0"
      - "--port"
      - "7233"
      - "--ui-port"
      - "8233"
      - "--dynamic-config-value"
      - "limit.blobSize.warn=8388608"
      - "--dynamic-config-value"
      - "limit.blobSize.error=16777216"
      - "--dynamic-config-value"
      - "limit.historySize.warn=104857600"
      - "--dynamic-config-value"
      - "limit.historySize.error=209715200"
      - "--dynamic-config-value"
      - "limit.historyCount.warn=51200"
      - "--dynamic-config-value"
      - "limit.historyCount.error=102400"
      - "--dynamic-config-value"
      - "frontend.rpc.maxReceivedMessageSize=33554432"
      - "--dynamic-config-value"
      - "history.rpc.maxReceivedMessageSize=33554432"
    volumes:
      - temporal_data:/data
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    # Temporal's Go runtime multiplexes goroutines onto OS threads; under
    # concurrent workflow load 256 exhausted the pid budget. 1024 holds.
    pids_limit: 1024

  # ── ollama — local embedding server (nomic-embed-text) ──────────────
  ollama:
    logging: *default-logging
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        SERVE_PID=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull nomic-embed-text || echo "[ollama] pull failed, will retry next boot"
        wait $$SERVE_PID
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512

  # ── hermes — the single AI runtime (replaces openclaw + openclaw-workers) ─
  # One image runs three `hermes -p <profile> gateway` processes; each binds
  # its OpenAI-compatible /v1 API server on the canonical port:
  #   * main profile    — user-facing chat, API on :18789
  #   * workers profile — background agents, API on :18790
  #   * heavy profile   — Opus-class background reasoning, API on :18791
  #                       (compose-network only — not published to the host)
  # The supervised entrypoint baked into the image launches all three. The
  # hermes-shim compat layer was retired in issue #40 — callers speak the
  # Hermes /v1 API directly.
  hermes:
    logging: *default-logging
    image: ssdavidai00/alfred-black-hermes:latest
    # Gateway ports bind 0.0.0.0 inside the container on the four reserved
    # ports (18789/18790/18791/18793) PLUS any registry-allocated user-facing
    # profile port (18794..18799 per #120 Lane II). These are reachable via
    # the compose default network as `http://hermes:<port>` from sibling
    # containers (ctrl-api, paperclip, alfred-learn, voice-bridge). They are
    # NOT published on the VM's public interface — the only external surface
    # is Caddy ingress on :443 through ctrl-api's auth-gated proxy. Binding
    # user-facing profile ports to the public IP would expose them with no
    # TLS or auth wrapping.
    #
    # EXCEPTION — the `main` gateway (18789) is published on the HOST LOOPBACK
    # only (127.0.0.1). This lets an operator/principal reach the main chat
    # profile from their own machine via an SSH local-forward — e.g.
    # `ssh -L 8642:localhost:18789 root@<host>` then point Hermes Desktop at
    # http://localhost:8642/v1 — without chasing the container's bridge IP
    # (which changes on restart). 127.0.0.1 binding keeps it off the public
    # interface: reachable only from on the VM (i.e. through SSH), never from
    # the internet, and the gateway still requires the Bearer API_SERVER_KEY.
    ports:
      - "127.0.0.1:18789:18789"
    depends_on:
      init:
        condition: service_completed_successfully
      temporal:
        condition: service_healthy
    volumes:
      - hermes_data:/hermes-state
      - vault_data:/vault
      - alfred_data:/alfred-data
      # Sealed builder runtime workspace — mounted in the hermes container
      # only. Owned uid 10001 mode 0700 by the init container (PR 4); the
      # codex-builder gateway process drops to uid 10001 (PR 4) and is the
      # only consumer. Not mounted in paperclip / ctrl-api / web / any other
      # service: the run data is not even visible to the rest of the stack.
      # See docs/codex-builder-runtime.md §5.
      - hermes_codex_work:/work
      # Store 5 (files) — read-only mount of the principal-facing blob
      # volume. PR 2 of issue #114 will give Hermes a files__read MCP
      # tool that reaches blobs via this mount; ctrl-api is the SOLE
      # writer (mounted :rw in its own stanza below). docs/specs/
      # issue-114-local-file-storage.md §5.1.
      - files_data:/files:ro
    tmpfs:
      - /tmp:size=256m
    environment:
      - HERMES_API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - HERMES_HOME=/hermes-state
      - OPENCLAW_GATEWAY_TOKEN_FILE=/alfred-data/.gateway-token
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # heavy profile (:18791, compose-network only) model seed. The init
      # container renders profile config from this (via its env_file: .env);
      # pinned here too so the value is unambiguous at the hermes boundary.
      - HERMES_HEAVY_MODEL=${HERMES_HEAVY_MODEL:-anthropic/claude-opus-4-6}
      # codex-builder profile (:18793) — Sir's decision #2 in
      # docs/codex-builder-runtime.md §11.2. Default false: the profile is
      # rendered everywhere by the init container, but the supervisor's
      # 4th `start_proc` only fires when this is true. Home flips this to
      # true in /opt/alfred/.env; rj/joe/zsolt/miguel leave it unset and
      # get an idle profile dir with no listening process on :18793.
      - ENABLE_CODEX_BUILDER=${ENABLE_CODEX_BUILDER:-false}
      # Model used by the codex-builder profile's supervising Hermes agent
      # (the codex CLI invocation it shells out to uses the same model).
      # Default tracks the latest OpenAI Codex model; overridable.
      - HERMES_CODEX_BUILDER_MODEL=${HERMES_CODEX_BUILDER_MODEL:-gpt-5-codex}
      - NODE_OPTIONS=--max-old-space-size=3072
      - CTRL_API_URL=http://ctrl-api:3100
      # Per-job timeout (seconds) Hermes applies to every `cron` job. This is
      # the cron analogue of the Temporal `execution_timeout` the `learn`
      # schedules set today. Issue #56 audited every workflow in the
      # cron-eligible set (WORKFLOW-DURABILITY.md) + the two #51 movers: the
      # largest Temporal timeout being replaced is SignalExtractWorkflow at
      # 25 min (register_schedules.py register_signal_extract — 10 chunks ×
      # 120 s ≈ 1200 s worst case, 25-min envelope); StreamEventPurgeWorkflow
      # is 10 min; most others set no Temporal timeout at all. 1800 s = the
      # 25-min ceiling + a 5-min margin, so a long-tail signal-extract tick is
      # never killed mid-flight (silent data loss). MUST stay ≥ the largest
      # Temporal execution_timeout before #48 moves any workflow to cron.
      - HERMES_CRON_TIMEOUT=1800
      # NOTE: TELEGRAM_BOT_TOKEN is intentionally NOT passed through here.
      # Hermes' gateway reads platform secrets from each profile's per-profile
      # .env file ($HERMES_HOME/profiles/main/.env), NOT from the container
      # environment. ctrl-api's PUT /api/v1/channels/telegram/token writes
      # the token directly into that file via `docker exec` and SIGTERMs the
      # gateway so the supervisor restarts and picks it up. Surfacing the
      # token as a compose env var here would be misleading dead config —
      # Hermes ignores it and the file in the hermes_data volume wins.
    # #222 defense-in-depth (Lane V-b): raise the open-files ceiling well
    # above the 1024 default soft limit. The codex-builder gateway leaks fds
    # (root cause fixed at source by #222 Lane V-a); under the 1024 default
    # the leak exhausts the table fast and EVERY subsequent socket/sqlite
    # open fails with `[Errno 24] Too many open files` — Slack `auth.test`
    # drops, kanban hits `unable to open database file`, the gateway wedges
    # silently. A 65536 ceiling buys headroom and, paired with the fd-pressure
    # healthcheck below, converts a silent wedge into an early UNhealthy.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # the hermes image (python:3.12-slim base) ships curl, not wget.
      # Probe BOTH gateways: main :18789 (chat/onboarding) AND workers :18790
      # (clerk/background). alfred-learn depends_on hermes service_healthy, so a
      # dead workers gateway must keep the container UNhealthy — otherwise learn
      # boots against a dead clerk gateway (FAILURE-MODES §Hermes runtime).
      #
      # #222 defense-in-depth (Lane V-b): the HTTP probes below only flip the
      # container UNhealthy AFTER a gateway socket actually dies of fd
      # starvation — by which point Slack `auth.test` has already dropped and
      # kanban sqlite has hit `unable to open database file`. They are a
      # LAGGING indicator. The fd-pressure gate that runs first is the LEADING
      # one: it walks every running `… gateway run` process (procps `pgrep` is
      # installed), reads each one's live open-fd count (`/proc/<pid>/fd`)
      # against its own soft limit (`/proc/<pid>/limits` -> "Max open files"),
      # and trips the container UNhealthy at >=90% utilisation — BEFORE the
      # first `[Errno 24] Too many open files` surfaces downstream. Cheap (a
      # /proc walk over ~2-4 pids, no forks beyond pgrep/awk/ls/wc), POSIX-sh,
      # runs every interval. With the ulimits.nofile raise above the soft
      # limit is 65536, so the trip point is ~58982 fds: the upstream leak's
      # climb is now visible as an early UNhealthy instead of a silent wedge.
      # Note: `$$` escapes `$` for compose interpolation -> the container sees
      # a single `$` (real shell variables, not compose vars).
      test: ["CMD-SHELL", "for p in $$(pgrep -f 'gateway run'); do l=$$(awk '/Max open files/{print $$4}' /proc/$$p/limits 2>/dev/null); [ -z \"$$l\" ] && continue; [ \"$$l\" = unlimited ] && continue; n=$$(ls /proc/$$p/fd 2>/dev/null | wc -l); [ \"$$n\" -ge $$((l * 9 / 10)) ] && exit 1; done; curl -fsS http://127.0.0.1:18789/health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:18790/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      # NET_ADMIN — needed by PR 4's iptables egress allowlist scoped to
      # uid 10001 (codex-builder), which installs OUTPUT rules at supervisor
      # boot to allow OpenAI / GitHub / npm / PyPI / crates.io egress and
      # REJECT everything else for uid 10001. The cap is dormant until PR 4
      # adds the iptables setup script; it does NOT grant any of the other
      # 3 profiles new privileges (they run as uid 10000 and their egress
      # paths are unrestricted today). See docs/codex-builder-runtime.md §6.
      - NET_ADMIN
      # SETUID + SETGID — needed by PR 4's `setpriv --reuid=10001
      # --regid=10001 ...` wrap on the codex-builder gateway's start_proc.
      # Without these the supervisor (running as root) gets
      # `setpriv: setresuid failed: Operation not permitted` and the
      # codex-builder gateway crashes in a tight restart loop. cap_drop:
      # ALL + this targeted cap_add is still a much tighter posture than
      # the default (which doesn't drop ALL). Live-observed crash loop
      # on home 2026-05-28 right after PR #104 landed.
      - SETUID
      - SETGID
    # Sized for two Python gateway processes + MCP stdio children. The
    # workers side carries the heavier task-registry boot path.
    mem_limit: 6g
    pids_limit: 2048

  # ── alfred — the vault daemon (curator / janitor / distiller / surveyor) ─
  alfred:
    logging: *default-logging
    image: ssdavidai00/alfred-worker:latest
    depends_on:
      hermes:
        condition: service_healthy
      ctrl-api:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - vault_data:/vault
      - alfred_data:/app/data
      - hermes_data:/root/.hermes
      # Store 5 (files) — read-only mount of the principal-facing blob
      # volume. The vault daemon's PR-4 extraction pipeline will read
      # uploaded files via this mount; ctrl-api stays the SOLE writer.
      # docs/specs/issue-114-local-file-storage.md §5.1.
      - files_data:/files:ro
    tmpfs:
      - /tmp:size=256m
    environment:
      # Vault subagents (curator/janitor/distiller) run on the workers
      # gateway — :18790, never main.
      - OPENCLAW_GATEWAY_URL=http://hermes:18790
      - ALFRED_CTRL_URL=http://ctrl-api:3100
      # Surveyor cluster-labeling routes through Hermes (workers profile);
      # the gateway owns the model + provider key. Empty = standalone mode.
      - SURVEYOR_HERMES_GATEWAY_URL=http://hermes:18790
      # Every LLM call from this container now goes through Hermes (vault
      # subagents via OPENCLAW_GATEWAY_URL, surveyor via the line above), so
      # the raw provider keys are not needed here. Blank them (env_file still
      # supplies everything else) — Hermes is the sole holder of provider keys.
      - OPENROUTER_API_KEY=
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
    env_file:
      - .env
    entrypoint: ["bash", "-c", "rm -f /app/data/alfred.pid && set -a && [ -f /app/data/.env ] && source /app/data/.env; [ -f /app/data/.gateway-token ] && export OPENCLAW_GATEWAY_TOKEN=$(cat /app/data/.gateway-token) && export HERMES_GATEWAY_TOKEN=$(cat /app/data/.gateway-token); set +a && exec alfred --config /app/data/config.yaml up --foreground"]
    command: []
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
      - CHOWN
    # 6g — surveyor's HDBSCAN clustering pass peaks ~3.4 GB on a 10K+ vault.
    mem_limit: 6g
    pids_limit: 512

  # ── ctrl-api — the dashboard backend / tenant API (:3100) ───────────
  ctrl-api:
    logging: *default-logging
    image: ssdavidai00/alfred-ctrl-api:latest
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - vault_data:/vault
      - alfred_data:/alfred-data
      - hermes_data:/hermes-state
      - state_data:/state
      - ingest_data:/ingest
      - cold_data:/cold
      # Store 5 (files) — principal-facing blob volume. ctrl-api is the
      # SOLE writer (`:rw`); hermes + the alfred daemon mount this same
      # volume `:ro` and write only through POST /api/v1/files/upload.
      # Issue #114 PR 1; see docs/specs/issue-114-local-file-storage.md §5.1.
      - files_data:/files
      # Store 5 cold archive (#114 PR 5) — companion volume for ZSTD-19
      # compressed copies of any blob untouched for 90+ days. The daily
      # FilesColdArchiveWorkflow (alfred-learn) drives the promotion via
      # ctrl-api's POST /api/v1/files/cold-promote endpoint, which:
      #   1. reads the live blob from /files
      #   2. streams it through node:zlib.createZstdCompress at level 19
      #   3. lands the compressed bytes at /cold-files/<ULID>.zst
      #   4. atomically flips file_blobs.path to `cold:<ULID>` and
      #      unlinks the live copy.
      # GET /api/v1/files/blob/* transparently decompresses cold reads
      # via createZstdDecompress — the principal sees the same shape on
      # the read side either way. Only ctrl-api needs RW on this volume;
      # no other service mounts it.
      - files_cold_data:/cold-files
      # ctrl-api restarts sibling containers (worker ops, chore runs).
      - /var/run/docker.sock:/var/run/docker.sock
      # The host compose dir, bind-mounted RW. ctrl-api modules
      # (models.ts/credentials.ts/admin.ts/logs.ts) read and write
      # ${COMPOSE_DIR}/.env and shell out to `docker compose -f
      # ${COMPOSE_DIR}/docker-compose.yaml`. COMPOSE_DIR defaulted to the
      # bare-VM path /srv/alfred-black, which does not exist in this
      # containerized single-VM topology, so every .env read/write threw
      # ENOENT (e.g. the empty model catalog). RW so credential and
      # provider-key writes land in the real file the rest of the
      # stack reads. ${COMPOSE_DIR_HOST} defaults to /opt/alfred (the merged
      # single-VM layout); override in .env for a different host path.
      - ${COMPOSE_DIR_HOST:-/opt/alfred}:/srv/alfred-black
      # Host's authorized_keys, READ-WRITE — GET /api/v1/system/ssh-info
      # surfaces the operator-installed pubkey on the /channels Terminal
      # card (Sir #8, 2026-05-24); POST/DELETE /api/v1/system/ssh-keys
      # let the operator add/revoke keys from the same card (Sir self-
      # contained-card rework, 2026-05-26). RW is intentional and safe:
      # ctrl-api is already the trust-root for the VM (docker socket,
      # vault writes, secret rotation); the bootstrap line is locked at
      # the API layer to prevent UI lockout.
      - /root/.ssh/authorized_keys:/root/.ssh/authorized_keys
    env_file:
      - .env
    environment:
      - AAS_HOST=0.0.0.0
      - AAS_PORT=3100
      - NODE_ENV=production
      - COMPOSE_PROJECT_NAME=alfred-black
      # Point ctrl-api at the bind-mounted host compose dir above so
      # ${COMPOSE_DIR}/.env and ${COMPOSE_DIR}/docker-compose.yaml resolve.
      # (helpers.ts default is the bare-VM /srv/alfred-black; the mount makes
      # that default path real inside the container.)
      - COMPOSE_DIR=/srv/alfred-black
      # The tenant's public base URL. composeWebhookUrl() (streams.ts) builds
      # absolute OMI/custom-webhook endpoint URLs from it; unset → it returns
      # null and the OMI device / custom-webhook URL comes back empty (F41/F69).
      # Defaults to https://${DOMAIN}; override via TENANT_BASE_URL in .env.
      - TENANT_BASE_URL=${TENANT_BASE_URL:-https://${DOMAIN}}
      # Env hygiene (F43): pin the runtime paths/hosts ctrl-api modules read,
      # rather than leaning on code defaults that diverge from this topology.
      #   VAULT_PATH       — vault/workspace/webhook fs root (the vault_data
      #                      mount is /vault; was unset → relied on the code
      #                      default, which differed across modules).
      #   ALFRED_DATA_DIR  — streams/agentmail/chore scratch (alfred_data
      #                      mount is /alfred-data; was unset).
      #   SAAS_HOST        — generic webhook URL fallback; the code default
      #                      was the wrong cross-tenant https://alfred.black.
      #                      Pin to this tenant's own host.
      - VAULT_PATH=/vault
      - ALFRED_DATA_DIR=/alfred-data
      - SAAS_HOST=${SAAS_HOST:-https://${DOMAIN}}
      - OPENCLAW_GATEWAY_TOKEN_FILE=/alfred-data/.gateway-token
      # ctrl-api reads/writes Hermes profile config.yaml at ${dir}/<profile>/;
      # point it at the profiles parent so paths resolve to
      # /hermes-state/profiles/{main,workers}/config.yaml
      - HERMES_CONFIG_DIR=/hermes-state/profiles
      # Sure REST proxy auth. sure-bootstrap.rb seeds this same value into
      # Sure's DB; ctrl-api's sure.ts reads only process.env.SURE_API_KEY. Pin
      # it explicitly (env_file also injects it) so the bridge is unambiguous —
      # without it every Sure proxy returns NOT_CONFIGURED and finance is blank.
      - SURE_API_KEY=${SURE_API_KEY:-}
      # Paperclip full-seed token tuple — bootstrap-paperclip.sh step 11b
      # writes these into /opt/alfred/.env on first boot. Listed explicitly
      # here so it's obvious which vars ctrl-api consumes (channels_paperclip
      # .ts reads PAPERCLIP_AGENT_TOKEN as the authoritative "ready" marker).
      # env_file already injects them; the `:-` default lets compose parse
      # before the seed has run.
      - PAPERCLIP_AGENT_TOKEN=${PAPERCLIP_AGENT_TOKEN:-}
      - PAPERCLIP_AGENT_ID=${PAPERCLIP_AGENT_ID:-}
      - PAPERCLIP_COMPANY_ID=${PAPERCLIP_COMPANY_ID:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3100/api/v1/learning/status -H \"Authorization: Bearer $AAS_API_KEY\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g
    # ctrl-api fronts all docker-exec traffic into sibling containers; a
    # higher fork budget than peer services.
    pids_limit: 1024

  # ── alfred-learn — the Temporal intelligence worker ─────────────────
  alfred-learn:
    logging: *default-logging
    image: ssdavidai00/alfred-learn:latest
    # Run as uid 1000 to match the bind-mount ownership convention.
    user: "1000:1000"
    depends_on:
      temporal:
        condition: service_healthy
      hermes:
        condition: service_healthy
      ctrl-api:
        condition: service_healthy
    volumes:
      - vault_data:/vault
      - alfred_data:/alfred-data
      - hermes_data:/hermes-state
    environment:
      - TEMPORAL_HOST=temporal:7233
      # Both gateway URLs point at the Hermes /v1 API ports (see
      # packages/learn/src/config.py). main = :18789, workers = :18790,
      # heavy = :18791 (Opus-class, onboarding/chore heavy reasoning).
      - OPENCLAW_GATEWAY_URL=http://hermes:18789
      - OPENCLAW_WORKERS_GATEWAY_URL=http://hermes:18790
      - EXECUTION_GATEWAY_URL=http://hermes:18790
      - HERMES_HEAVY_GATEWAY_URL=http://hermes:18791
      - OPENCLAW_GATEWAY_TOKEN_FILE=/alfred-data/.gateway-token
      # Onboarding/chore heavy reasoning + clerk all route through Hermes now;
      # no direct provider calls remain here. Blank the raw keys (env_file
      # still supplies everything else) — Hermes is the sole key holder.
      - OPENROUTER_API_KEY=
      - OPENAI_API_KEY=
      - ANTHROPIC_API_KEY=
      - VAULT_PATH=/vault
      - TASK_QUEUE=alfred-learn
      # OMI ambient transcription. OmiAudioProcessorWorkflow transcribes
      # captured wearable audio via Groq Whisper (omi_audio.py reads
      # GROQ_API_KEY). env_file: .env injects it too, but the raw provider
      # keys above are explicitly blanked here, so pin GROQ through cleanly
      # — without it every audio group is discarded as "empty transcription"
      # and OMI capture is silently dead.
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ALFRED_LEARN_ENABLED=${ALFRED_LEARN_ENABLED:-true}
      - ALFRED_CTRL_URL=http://ctrl-api:3100
      # Signal pipeline (#78): stream events → signals → decision cards.
      # Both default ON so the Desk fills; gate at registration time, so a
      # change requires an alfred-learn restart to re-run register_schedules.
      - STEWARD_SIGNAL_EXTRACT_ENABLED=${STEWARD_SIGNAL_EXTRACT_ENABLED:-true}
      - STEWARD_SIGNAL_ROUTER_ENABLED=${STEWARD_SIGNAL_ROUTER_ENABLED:-true}
      # Delegate dispatch — use the ephemeral-executor path (Phase 2 #22) so
      # each principal-explicit delegate gets its own ``exec-<hash>`` Hermes
      # session (audit boundary per task; no cross-contamination from the
      # shared learn-clerk context). The legacy prompt was also patched to
      # honour ``principal_note`` (signal_actions.py, 2026-05-25 EDITH
      # repro), so both paths now route Sir's note as the canonical task —
      # but ephemeral is the intended default and we cut over here.
      - DISPATCH_USE_EPHEMERAL_EXECUTOR=${DISPATCH_USE_EPHEMERAL_EXECUTOR:-1}
      # Composio Python SDK writes its module-load cache under $HOME; the
      # container has no writable $HOME, so pin both to /tmp.
      - COMPOSIO_CACHE_DIR=/tmp/composio
      - HOME=/tmp
      - WORKERS_OPENCLAW_CONFIG=/hermes-state/profiles/workers/config.yaml
      # Owner identity. The code reads OWNER_EMAIL (pull.py, first_brief_email.py,
      # fleet_audit.py, init step 9, sure-bootstrap.rb); the legacy
      # ALFRED_OWNER_EMAIL alias is still honoured. Set BOTH from the same .env OWNER_EMAIL so the
      # cross-tenant ingest guard, first-brief sender allowlist, and meeting-bot
      # attendee match all see the principal's address. (C9: canonical=OWNER_EMAIL.)
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - ALFRED_OWNER_EMAIL=${OWNER_EMAIL:-}
    env_file:
      - .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    pids_limit: 512

  # ── voice-bridge — Twilio Media Streams ↔ OpenAI gpt-realtime bridge ──
  # Real-time phone-call adapter. Hermes does NOT do realtime Twilio audio
  # natively (open feature request #409 upstream); this small WebSocket
  # service bridges Twilio's mulaw Media Streams to OpenAI's Realtime API
  # and dispatches tool calls back to ctrl-api. Reuses the SMS half's
  # Twilio credentials — same number rings; same allow-list applies.
  #
  # Inbound flow: Twilio number → Twilio webhook (mode=realtime) → SaaS
  # initiate-call endpoint → Twilio streams audio over WSS to
  # voice.${DOMAIN} → this container bridges Twilio audio ↔ OpenAI
  # Realtime ↔ tool calls back to ctrl-api → call ends → POST transcript
  # to /api/v1/phone/transcript (Phase 3 will also write to alfred_journal).
  #
  # The image was orphaned (code complete, never deployed) before this
  # phase landed. /api/v1/channels/voice/status (ctrl-api) exposes
  # deploy-readiness to the UI's PhoneCard Voice section.
  voice-bridge:
    logging: *default-logging
    image: ssdavidai00/alfred-voice-bridge:latest
    # Off by default — gated behind the `voice` profile (mirrors `tailscale`).
    # The bridge requires OPENAI_API_KEY + VOICE_BRIDGE_INTERNAL_TOKEN, so a
    # plain `docker compose up -d` must NOT start it (it would crash-loop).
    # Enable per-tenant: `docker compose --profile voice up -d voice-bridge`.
    profiles: ["voice"]
    restart: unless-stopped
    depends_on:
      ctrl-api:
        condition: service_healthy
    environment:
      VOICE_BRIDGE_PORT: "9000"
      VOICE_BRIDGE_METRICS_PORT: "9001"
      # Shared secret — voice-bridge expects this present, ctrl-api signs
      # outbound /api/v1/phone/call requests with it. Auto-generated by
      # scripts/bootstrap.sh if absent.
      VOICE_BRIDGE_INTERNAL_TOKEN: ${VOICE_BRIDGE_INTERNAL_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-2}
      OPENAI_REALTIME_VOICE: ${OPENAI_REALTIME_VOICE:-cedar}
      VOICE_BRIDGE_DEBUG: "${VOICE_BRIDGE_DEBUG:-}"
      # ctrl-api is the "SaaS internal" surface on this single-VM build —
      # the bridge calls back for tenant lookup, tool dispatch, and (in
      # Phase 3) alfred_journal writes on transcript ingest.
      SAAS_INTERNAL_URL: http://ctrl-api:3100
      # Phase 4.1 single-VM short-circuit. When ENABLE_SINGLE_VM_MODE=1 the
      # bridge skips the legacy SaaS tenant handshake and talks to ctrl-api
      # at SAAS_INTERNAL_URL directly, presenting VOICE_BRIDGE_INTERNAL_TOKEN
      # as a SCOPED Bearer. ctrl-api's auth.ts accepts that token only for
      # the 2 voice-bridge routes (/voice-context GET, /transcript POST) —
      # everything else under /api/v1/* refuses it. The bridge therefore
      # does NOT hold the ctrl-api master key (AAS_API_KEY) — this is
      # principle-of-least-privilege for a network-edge service that talks
      # to Twilio audio + OpenAI Realtime WSS. TWILIO_PHONE_NUMBER is the
      # calling identity surfaced to the realtime agent's system prompt.
      ENABLE_SINGLE_VM_MODE: "1"
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      # Twilio Auth Token — enables X-Twilio-Signature validation on the
      # inbound /twiml/inbound webhook. Lax mode (warning-log only) when
      # empty, strict mode the moment a token is set.
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      # Caller allowlist (set via /channels Phone card → PUT /api/v1/channels/
      # voice/allowlist). Default policy is OPEN: with both empty, every
      # caller is accepted. Disallowed callers get a <Reject> TwiML, never
      # reaching gpt-realtime — zero OpenAI cost on rejection.
      VOICE_ALLOWED_CALLERS: ${VOICE_ALLOWED_CALLERS:-}
      VOICE_ALLOW_ALL_CALLERS: ${VOICE_ALLOW_ALL_CALLERS:-}
      # MCP-client wiring (see packages/voice-bridge/src/mcp-clients.ts).
      # voice-bridge connects as a programmatic client to mcp-server's five
      # per-app HTTP endpoints (alfred / sure / plane / vaultwarden / execute)
      # so the voice agent's tool surface mirrors Hermes-main's. The bypass
      # added in #44/#45 accepts MCP_APPROVAL_SECRET as a Bearer.
      MCP_SERVER_URL: http://mcp-server:8787
      MCP_APPROVAL_SECRET: ${MCP_APPROVAL_SECRET}
      MAX_CALL_SECONDS: "1800"
      IDLE_HANGUP_SECONDS: "60"
      # ESPHome Native API listener (issue #112 — HA Voice). PR1 ships the
      # connect+pair+idle skeleton; the voice_assistant audio flow lands in
      # PR2/PR3 and the per-area budget in PR7. ESPHOME_API_ENABLED defaults
      # to "0" inside the container — we flip it to "1" here so single-VM
      # tenants pair with HA out of the box. HA_VOICE_API_TOKEN stays empty
      # in PR1 (tailnet boundary per spec §5.5 Q7); PR2 wires it into the
      # channel_tokens table from #111.
      ESPHOME_API_ENABLED: "${ESPHOME_API_ENABLED:-1}"
      ESPHOME_API_PORT: "6053"
      ESPHOME_API_BIND: "0.0.0.0"
      HA_VOICE_API_TOKEN: "${HA_VOICE_API_TOKEN:-}"
      # Stable per-tenant seed for the synthetic ESPHome device's MAC. Empty
      # default falls back to os.hostname(); tenants on shared hostnames
      # (none today) would set this explicitly.
      ESPHOME_TENANT_SEED: "${ESPHOME_TENANT_SEED:-}"
      ESPHOME_FRIENDLY_NAME: "${ESPHOME_FRIENDLY_NAME:-Alfred}"
      # ── Wyoming Protocol fallback (issue #112 PR5) ──────────────────
      # Off by default — most tenants route HA → us via the ESPHome
      # Native API (PR1/PR2) which has a shorter audio path. Flip to
      # WYOMING_ENABLED=1 on tenants whose HA install can't reach :6053
      # over the LAN (HA-OS / HA-Cloud) but CAN reach the Wyoming server
      # on the tailnet. Same brain factory, different transport.
      WYOMING_ENABLED: "${WYOMING_ENABLED:-0}"
      WYOMING_PORT: "10300"
      WYOMING_BIND: "0.0.0.0"
    ports:
      # ESPHome Native API. Plain TCP — not HTTP — so Caddy can't terminate
      # it; HA's ESPHome integration expects no TLS on :6053 (the
      # noise-encrypted variant is out of scope for PR1, see spec §5.5).
      #
      # Bound to 127.0.0.1 ONLY — issue #112 PR 4 flipped this from a
      # wide-open 0.0.0.0:6053:6053 bind. Recommended remote ingress for
      # the principal's ESPHome devices is the Tailscale sidecar
      # (`docker compose --profile tailscale up -d`), which advertises
      # :6053 onto the tailnet; OR an mDNS-reachable subnet for satellite
      # devices on the same LAN. End-to-end setup steps:
      # packages/voice-bridge/docs/ha-pipeline-setup.md.
      - "127.0.0.1:6053:6053"
      # Wyoming Protocol fallback (#112 PR5). Also localhost-only — HA's
      # Wyoming integration reaches it the same way as the ESPHome listener
      # (via the Tailscale sidecar's `tailscale serve --bg 10300` when the
      # operator enables it). Bound iff WYOMING_ENABLED=1; the listener
      # itself only boots when the env flag is set, so leaving the port
      # mapping on with the flag off is a no-op.
      - "127.0.0.1:10300:10300"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256

  # ── mcp-server — MCP HTTP server for Claude Custom Connectors (:8787) ─
  mcp-server:
    logging: *default-logging
    image: ssdavidai00/alfred-mcp-server:latest
    restart: unless-stopped
    depends_on:
      ctrl-api:
        condition: service_started
    env_file:
      - .env
    environment:
      - PORT=8787
      - CTRL_URL=http://ctrl-api:3100
      - DATA_DIR=/data
      - PUBLIC_URL=https://mcp.${DOMAIN}
      - TENANT_LABEL=${OWNER_NAME}
    volumes:
      - mcp_server_data:/data
    mem_limit: 256m
    pids_limit: 256

  # ── vaultwarden — the user-facing secrets manager ───────────────────
  vaultwarden:
    logging: *default-logging
    image: vaultwarden/server:latest
    restart: unless-stopped
    environment:
      - DOMAIN=https://vault.${DOMAIN}
      # signups allowed so the one-shot vault-signup can register the owner
      # account on first boot. Set false post-bootstrap if you want to lock
      # the instance (it is your own single-tenant Vaultwarden).
      - SIGNUPS_ALLOWED=true
      - INVITATIONS_ALLOWED=true
      - WEB_VAULT_ENABLED=true
      - SHOW_PASSWORD_HINT=false
      # SMTP intentionally left unset — Vaultwarden treats an empty
      # SMTP_HOST as "set but invalid". Unset = SMTP disabled.
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    env_file:
      - .env
    volumes:
      - vaultwarden_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:80/alive >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    mem_limit: 256m
    pids_limit: 256

  # ── vault-signup — one-shot: register the Vaultwarden owner account ─
  # Runs the Bitwarden registration crypto (bootstrap-signup.mjs, baked
  # into the image) so vault-cli has an account to `bw login` with.
  vault-signup:
    logging: *default-logging
    image: ssdavidai00/alfred-vault-init:latest
    restart: "no"
    depends_on:
      vaultwarden:
        condition: service_healthy
    environment:
      - BW_SERVER_URL=http://vaultwarden:80
      - BW_USER=${OWNER_EMAIL:-${ACME_EMAIL}}
      - BW_PASSWORD=${VAULTWARDEN_BW_PASSWORD}
      - VAULTWARDEN_NAME=${OWNER_NAME}
      - VAULTWARDEN_ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
    # Idempotent: if the account already logs in, skip registration — so
    # re-running this one-shot (compose re-evaluates service_completed_
    # successfully deps) is always safe. The `bw logout` fences are load-
    # bearing: `bw config server` fails ("Logout required") if a prior
    # `bw login` left a session, so clear it before every config/login.
    # $$ escapes compose interpolation.
    entrypoint:
      - bash
      - -c
      - |
        bw logout >/dev/null 2>&1 || true
        bw config server "$$BW_SERVER_URL" >/dev/null 2>&1 || true
        if bw login "$$BW_USER" "$$BW_PASSWORD" --raw </dev/null >/dev/null 2>&1; then
          echo "[vault-signup] Vaultwarden account already registered — skipping"
          bw logout >/dev/null 2>&1 || true
        else
          bw logout >/dev/null 2>&1 || true
          node /opt/vault-init/bootstrap-signup.mjs
        fi
    mem_limit: 256m
    pids_limit: 256

  # ── vault-cli — long-running `bw serve` side-container ──────────────
  # Holds an unlocked bw session; ctrl-api proxies the Vaultwarden MCP
  # tool calls here over http://vault-cli:8087.
  vault-cli:
    logging: *default-logging
    image: ssdavidai00/alfred-vault-init:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BW_SERVER_URL=http://vaultwarden:80
      - BW_USER=${OWNER_EMAIL:-${ACME_EMAIL}}
      - BW_PASSWORD=${VAULTWARDEN_BW_PASSWORD}
    depends_on:
      vaultwarden:
        condition: service_healthy
      vault-signup:
        condition: service_completed_successfully
    entrypoint: ["bash", "/opt/vault-init/serve.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sSf http://127.0.0.1:8087/status >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 256m
    pids_limit: 256

  # ── Plane — self-hosted project management ──────────────────────────
  plane-db:
    logging: *default-logging
    image: postgres:15.7-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - plane_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1g
    pids_limit: 512

  plane-redis:
    logging: *default-logging
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - plane_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 256m
    pids_limit: 512

  plane-mq:
    logging: *default-logging
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=plane
      - RABBITMQ_DEFAULT_PASS=${REDIS_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=plane
    volumes:
      - plane_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 512m
    pids_limit: 512

  plane-minio:
    logging: *default-logging
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/export", "--console-address", ":9090"]
    environment:
      - MINIO_ROOT_USER=plane
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - plane_uploads:/export
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 256m
    pids_limit: 512

  # One-shot migrator — Plane factors migrations into a dedicated service
  # so the api/worker/beat don't deadlock racing to migrate on boot (#555).
  plane-migrator:
    logging: *default-logging
    image: makeplane/plane-backend:stable
    restart: "no"
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=plane.settings.production
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plane
      - POSTGRES_HOST=plane-db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@plane-redis:6379/0
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: ["/bin/sh", "-c", "./bin/docker-entrypoint-migrator.sh"]
    mem_limit: 512m
    pids_limit: 512

  plane-api:
    logging: *default-logging
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=plane.settings.production
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plane
      - POSTGRES_HOST=plane-db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@plane-redis:6379/0
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AMQP_URL=amqp://plane:${REDIS_PASSWORD}@plane-mq:5672/plane
      - USE_MINIO=1
      - AWS_ACCESS_KEY_ID=plane
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_S3_BUCKET_NAME=uploads
      - AWS_REGION=us-east-1
      # WEB_URL must be the PUBLIC URL — Plane builds browser redirects
      # from it. Internal plane→plane traffic uses compose aliases.
      - WEB_URL=https://plane.${DOMAIN}
      - ENABLE_SIGNUP=0
      - ENABLE_EMAIL_PASSWORD=1
      - ENABLE_MAGIC_LINK_LOGIN=0
      - API_KEY_RATE_LIMIT=600/minute
      - GUNICORN_WORKERS=2
    command: ["/bin/sh", "-c", "./bin/docker-entrypoint-api.sh"]
    networks:
      default:
        aliases:
          - api
    healthcheck:
      # plane-backend ships wget but not curl; gunicorn binds IPv4 only.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: 1g
    pids_limit: 512

  plane-worker:
    logging: *default-logging
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=plane.settings.production
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
      - POSTGRES_HOST=plane-db
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plane
      - REDIS_URL=redis://:${REDIS_PASSWORD}@plane-redis:6379/0
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AMQP_URL=amqp://plane:${REDIS_PASSWORD}@plane-mq:5672/plane
      - USE_MINIO=1
      - AWS_ACCESS_KEY_ID=plane
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_S3_BUCKET_NAME=uploads
      - AWS_REGION=us-east-1
    command: ["/bin/sh", "-c", "./bin/docker-entrypoint-worker.sh"]
    # celery + bgtask registry OOM-killed on boot at 1g; 2g holds.
    mem_limit: 2g
    pids_limit: 512

  plane-beat:
    logging: *default-logging
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=plane.settings.production
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
      - POSTGRES_HOST=plane-db
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plane
      - REDIS_URL=redis://:${REDIS_PASSWORD}@plane-redis:6379/0
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AMQP_URL=amqp://plane:${REDIS_PASSWORD}@plane-mq:5672/plane
    command: ["/bin/sh", "-c", "./bin/docker-entrypoint-beat.sh"]
    mem_limit: 256m
    pids_limit: 512

  plane-web:
    logging: *default-logging
    # plane-frontend:stable is nginx serving a static Next.js export on
    # :3000 (the image's own nginx.conf — do not override CMD).
    image: makeplane/plane-frontend:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=
      - NEXT_PUBLIC_DEPLOY_URL=
    networks:
      default:
        aliases:
          - plane-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 512m
    pids_limit: 512

  plane-space:
    logging: *default-logging
    # plane-space:stable runs react-router-serve on :3000 — don't override CMD.
    image: makeplane/plane-space:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=
      - NEXT_PUBLIC_DEPLOY_URL=
    networks:
      default:
        aliases:
          - space
    mem_limit: 256m
    pids_limit: 512

  plane-admin:
    logging: *default-logging
    # plane-admin:stable is nginx on :80, same pattern as plane-web.
    image: makeplane/plane-admin:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=
      - NEXT_PUBLIC_DEPLOY_URL=
    networks:
      default:
        aliases:
          - admin
    mem_limit: 256m
    pids_limit: 512

  plane-live:
    logging: *default-logging
    image: makeplane/plane-live:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
    environment:
      - API_BASE_URL=http://plane-api:8000
      - LIVE_BASE_PATH=/live
      - LIVE_SERVER_SECRET_KEY=${LIVE_SERVER_SECRET_KEY}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@plane-redis:6379/0
    networks:
      default:
        aliases:
          - live
    mem_limit: 256m
    pids_limit: 512

  plane-proxy:
    logging: *default-logging
    image: makeplane/plane-proxy:stable
    restart: unless-stopped
    depends_on:
      plane-api:
        condition: service_healthy
      plane-web:
        condition: service_healthy
    environment:
      # SITE_ADDRESS=:80 makes the bundled Caddyfile a plain-HTTP listener
      # with no ACME — alfred-black's own caddy service terminates TLS and
      # reverse-proxies plane.${DOMAIN} → plane-proxy:80.
      - SITE_ADDRESS=:80
      - TRUSTED_PROXIES=0.0.0.0/0
      - FILE_SIZE_LIMIT=5242880
      - BUCKET_NAME=uploads
    volumes:
      # Caddyfile override: stock upstream's bare aliases collide with
      # alfred-black's `web` service. Sir #6, 2026-05-24.
      - ./caddy/plane-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 128m
    pids_limit: 512

  # ── Sure — self-hosted personal finance ─────────────────────────────
  sure-db:
    logging: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=sure
      - POSTGRES_USER=sure
      - POSTGRES_PASSWORD=${SURE_POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - sure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sure -d sure"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1g
    pids_limit: 512

  sure-redis:
    logging: *default-logging
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${SURE_REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - sure_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${SURE_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    mem_limit: 256m
    pids_limit: 512

  sure-web:
    logging: *default-logging
    image: ghcr.io/we-promise/sure:stable
    restart: unless-stopped
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SECRET_KEY_BASE=${SURE_SECRET_KEY_BASE}
      - SELF_HOSTED=true
      - RAILS_ENV=production
      - RAILS_FORCE_SSL=false
      - RAILS_ASSUME_SSL=false
      - DB_HOST=sure-db
      - DB_PORT=5432
      - POSTGRES_DB=sure
      - POSTGRES_USER=sure
      - POSTGRES_PASSWORD=${SURE_POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${SURE_REDIS_PASSWORD}@sure-redis:6379/0
    # /alfred-data is shared with ctrl-api's Rails-runner-backed account
    # CRUD endpoints and the sure-init one-shot.
    volumes:
      - alfred_data:/alfred-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/up >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: 2g
    pids_limit: 512

  sure-worker:
    logging: *default-logging
    image: ghcr.io/we-promise/sure:stable
    restart: unless-stopped
    depends_on:
      sure-db:
        condition: service_healthy
      sure-redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - SECRET_KEY_BASE=${SURE_SECRET_KEY_BASE}
      - SELF_HOSTED=true
      - RAILS_ENV=production
      - RAILS_FORCE_SSL=false
      - RAILS_ASSUME_SSL=false
      - DB_HOST=sure-db
      - DB_PORT=5432
      - POSTGRES_DB=sure
      - POSTGRES_USER=sure
      - POSTGRES_PASSWORD=${SURE_POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${SURE_REDIS_PASSWORD}@sure-redis:6379/0
    command: ["bundle", "exec", "sidekiq"]
    mem_limit: 1g
    pids_limit: 512

  # One-shot Plane admin auto-seed (Sir #6, 2026-05-24). Creates owner
  # User + InstanceAdmin + flips is_setup_done=True via the ORM (HTTP
  # sign-up is CSRF-guarded). Idempotent. Uses plane-backend image so
  # Django settings live on PYTHONPATH for free.
  plane-init:
    logging: *default-logging
    image: makeplane/plane-backend:stable
    restart: "no"
    depends_on:
      plane-api:
        condition: service_healthy
      plane-migrator:
        condition: service_completed_successfully
      init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=plane.settings.production
      - DEBUG=0
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=postgresql://plane:${POSTGRES_PASSWORD}@plane-db:5432/plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=plane
      - POSTGRES_HOST=plane-db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@plane-redis:6379/0
      - REDIS_HOST=plane-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AMQP_URL=amqp://plane:${REDIS_PASSWORD}@plane-mq:5672/plane
      - USE_MINIO=1
      - AWS_ACCESS_KEY_ID=plane
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_S3_BUCKET_NAME=uploads
      - AWS_REGION=us-east-1
    volumes:
      - alfred_data:/alfred-data
    working_dir: /code
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -f /alfred-data/plane-bootstrap/plane-bootstrap.py ]; then
          echo "[plane-init] plane-bootstrap.py not staged at /alfred-data/plane-bootstrap/ — was alfred-init skipped?"
          exit 1
        fi
        exec python manage.py shell -c "exec(open('/alfred-data/plane-bootstrap/plane-bootstrap.py').read())"
    mem_limit: 512m
    pids_limit: 256

  # One-shot bootstrap. Reuses the sure-web image; idempotent — bootstrap.rb
  # short-circuits if /alfred-data/.sure-api-key already exists.
  sure-init:
    logging: *default-logging
    image: ghcr.io/we-promise/sure:stable
    restart: "no"
    depends_on:
      sure-web:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - SECRET_KEY_BASE=${SURE_SECRET_KEY_BASE}
      - SELF_HOSTED=true
      - RAILS_ENV=production
      - DB_HOST=sure-db
      - DB_PORT=5432
      - POSTGRES_DB=sure
      - POSTGRES_USER=sure
      - POSTGRES_PASSWORD=${SURE_POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${SURE_REDIS_PASSWORD}@sure-redis:6379/0
    volumes:
      - alfred_data:/alfred-data
    entrypoint: ["bin/rails", "runner", "/alfred-data/sure-bootstrap/bootstrap.rb"]
    mem_limit: 512m
    pids_limit: 256

  # ── Paperclip — AI-agent orchestration / "the company" ──────────────
  # Paperclip ("if OpenClaw is an employee, Paperclip is the company") is
  # the agent-team control plane: org charts, ticketing, delegation,
  # governance, costs. Hermes calls into it; the principal browses it
  # at https://paperclip.${DOMAIN}.
  #
  # Embedded Postgres: Paperclip ships PG inside the same container, so
  # — unlike Sure/Plane — there is NO separate paperclip-db sidecar.
  # All state lives in the paperclip_data volume.
  #
  # Healthcheck: Paperclip's docs do not document /api/health and the web
  # root (/) returns 403 to unauthenticated visits (better-auth rejects
  # before the React shell renders). The unauthed entry page /sign-in
  # returns 200 and is the right "is the app up?" probe (verified
  # 2026-05-26). If a future Paperclip release ships /api/health, switch
  # to `curl -fsS http://127.0.0.1:3100/api/health` for a tighter signal.
  paperclip:
    logging: *default-logging
    # alfred-black-paperclip: upstream ghcr.io/paperclipai/paperclip image
    # overlaid with our patched hermes-paperclip-adapter (HTTP-mode execute()
    # against the tenant's local hermes container at :18789). See
    # packages/paperclip/DESIGN.md for the rationale; the Dockerfile pins
    # the upstream base by digest with a tripwire that fails the build on
    # upstream version drift.
    image: ssdavidai00/alfred-black-paperclip:latest
    restart: unless-stopped
    # Wait for hermes to be healthy — the patched HTTP adapter reads hermes'
    # API_SERVER_KEY from profiles/main/.env (rendered by hermes init), so a
    # heartbeat that fires before init lands 401s against the gateway.
    depends_on:
      hermes:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PAPERCLIP_HOME=/paperclip
      - BETTER_AUTH_SECRET=${PAPERCLIP_BETTER_AUTH_SECRET}
      - PAPERCLIP_PUBLIC_URL=https://paperclip.${DOMAIN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # ── HTTP-mode hermes_local adapter ─────────────────────────────────
      # Where our patched adapter sends the per-heartbeat /v1/responses call.
      # The compose-network DNS name `hermes` resolves to the main gateway
      # at :18789 (see the hermes service above). Override per-tenant if
      # you point paperclip at a non-default gateway.
      - HERMES_GATEWAY_URL=http://hermes:18789
      # The adapter reads Hermes' API_SERVER_KEY out of
      # /hermes-state/profiles/main/.env at call time. Override the base
      # dir here if you mount hermes_data somewhere else.
      - HERMES_CONFIG_DIR=/hermes-state/profiles
    volumes:
      - paperclip_data:/paperclip
      # Read-only mount so the patched adapter can resolve Hermes'
      # API_SERVER_KEY from the rendered profile .env. Without this the
      # adapter falls back to no Authorization header and Hermes returns
      # 401. Mirrors the ctrl-api mount (server.ts:readHermesMainApiKey).
      # The .env is rendered 0o644 by the init container
      # (packages/hermes/init/render_hermes.py) so the paperclip node
      # server (uid 1000) can read it without supplementary-group plumbing.
      - hermes_data:/hermes-state:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/sign-in >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    mem_limit: 1g
    pids_limit: 512

  # ── paperclip-init — one-shot CEO-invite auto-bootstrap ──────────────
  # Paperclip's first-run requires two CLI commands inside the container:
  #   1. `pnpm paperclipai onboard -y --bind lan`     → writes config.json + .env
  #   2. `pnpm paperclipai auth bootstrap-ceo`        → prints the invite URL
  # Without them the principal hits the "Instance setup required" wall on
  # paperclip.<DOMAIN>/sign-in and has no path forward without SSH access
  # (live-observed on home 2026-05-27, 6 manual steps to recover).
  #
  # This one-shot service reuses the alfred-init image (the script ships
  # there at /setup/bootstrap-paperclip.sh) but:
  #   * mounts /var/run/docker.sock RO so it can `docker exec` into paperclip
  #     as the `node` user (uid 1000) — running as root creates an ownership
  #     trap on paperclip_data;
  #   * mounts alfred_data:/alfred-data so the parsed "Invite URL: …" lands
  #     at /alfred-data/paperclip-ceo-invite.txt, where ctrl-api reads it
  #     and surfaces it on the /channels Paperclip card (needs_admin_signup
  #     setup_state, see channels_paperclip.ts).
  #
  # Idempotent: re-runs are a no-op once the invite file + paperclip's
  # config.json are both present.
  paperclip-init:
    logging: *default-logging
    image: ssdavidai00/alfred-init:latest
    restart: "no"
    depends_on:
      paperclip:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # The script reads DOMAIN to construct default
      # PAPERCLIP_BASE_URL=https://paperclip.${DOMAIN}.
      - DOMAIN=${DOMAIN}
      # Operator overrides for the headless seed (defaults baked into the
      # script if blank). PAPERCLIP_SEED_* env_file already covers, but we
      # list them so it's obvious which knobs the seed honours.
      - PAPERCLIP_SEED_EMAIL=${PAPERCLIP_SEED_EMAIL:-}
      - PAPERCLIP_SEED_NAME=${PAPERCLIP_SEED_NAME:-}
      - PAPERCLIP_SEED_COMPANY=${PAPERCLIP_SEED_COMPANY:-}
      # HERMES_STATE_DIR points the board-key writer (step 12) at the
      # hermes_data volume mount declared below. The MCP server reads
      # PAPERCLIP_API_KEY from process env on stdio startup — writing
      # it into each profile's .env here is the seam that survives
      # `docker compose pull`.
      - HERMES_STATE_DIR=/hermes-state
    volumes:
      - alfred_data:/alfred-data
      # RO socket — the script only invokes `docker exec` / `docker inspect`.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The host compose dir, bind-mounted RW so step 11b can persist
      # PAPERCLIP_AGENT_TOKEN/_AGENT_ID/_COMPANY_ID into /opt/alfred/.env
      # (== /srv/alfred-black/.env inside the container — same path
      # ctrl-api uses to read/write the .env). Without this mount the
      # full seed cannot complete; only the legacy invite-file fallback
      # would land.
      - ${COMPOSE_DIR_HOST:-/opt/alfred}:/srv/alfred-black
      # hermes_data RW so step 12 can write PAPERCLIP_API_KEY into each
      # profile's .env. The MCP server inside Hermes reads
      # ``PAPERCLIP_API_KEY`` from process env at stdio startup; writing
      # the board API key here is the only seam that survives
      # `docker compose pull` (PAPERCLIP_ is in render_hermes.py's
      # _RUNTIME_KEY_PREFIXES so future init re-renders preserve it).
      # 2026-05-27: PR #87's smoke test caught the missing wiring — every
      # MCP tool call from Hermes 401-ed because the agent token
      # (PAPERCLIP_AGENT_TOKEN, scope=agent) gives 403 "Board access
      # required" on the company-scoped routes the MCP tools call.
      - hermes_data:/hermes-state
    entrypoint: ["./bootstrap-paperclip.sh"]
    mem_limit: 256m
    pids_limit: 256

  # ── Tailscale sidecar (profile: tailscale) — issue #109 PR 1 ─────────
  # OFF by default on every fresh tenant. `docker compose up -d` does NOT
  # start this container — only `docker compose --profile tailscale up -d`
  # does (which PR 3's /connections card will invoke on the principal's
  # "Turn on" click). The principal then drives Connect from the dashboard
  # and the sidecar joins their own tailnet via Tailscale's device-style
  # auth-URL flow (path C; see docs/specs/issue-109-tailscale-via-ui.md).
  #
  # Hostname: derived from $DOMAIN with dots replaced by dashes
  # (e.g. DOMAIN=home.alfred.black → home-alfred-black). Compose's variable
  # interpolation does NOT support Bash-style `${VAR//./-}` pattern
  # substitution, so bootstrap.sh derives the value and writes it to .env
  # as TAILSCALE_HOSTNAME_PREFIX. The fallback to $DOMAIN here is purely
  # defensive — Tailscale accepts dotted hostnames but normalises them,
  # which is less predictable than the bootstrap-derived form.
  # See §3.2.1 of the spec.
  #
  # State (the node key in tailscaled.state) lives in the named volume
  # `tailscale_data`; surviving `docker compose pull` is the whole point.
  # PR 2 lands the ctrl-api routes that drive `tailscale up / status /
  # logout / down` via `docker exec`; PR 3 the /connections card; PR 4
  # `tailscale cert` + `tailscale serve` for inbound from the tailnet.
  tailscale:
    logging: *default-logging
    image: tailscale/tailscale:stable
    profiles: ["tailscale"]
    hostname: "${TAILSCALE_HOSTNAME_PREFIX:-${DOMAIN}}"
    environment:
      TS_AUTHKEY: "${TAILSCALE_AUTHKEY:-}"
      TS_STATE_DIR: "/var/lib/tailscale"
      TS_HOSTNAME: "${TAILSCALE_HOSTNAME_PREFIX:-${DOMAIN}}"
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--accept-routes ${TAILSCALE_TAGS:+--advertise-tags=${TAILSCALE_TAGS}}"
    volumes:
      - tailscale_data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    mem_limit: 128m

volumes:
  vault_data:
  # Store 5 (files) — principal-facing opaque blob volume. ctrl-api
  # owns this volume :rw; hermes + the alfred daemon mount it :ro and
  # write only through POST /api/v1/files/upload. Issue #114 PR 1.
  # docs/specs/issue-114-local-file-storage.md.
  files_data:
  # Store 5 cold archive (#114 PR 5) — companion to files_data, holds
  # ZSTD-19 compressed copies of any blob untouched for 90+ days. ctrl-api
  # is the sole consumer; nothing else mounts this volume. The blob layout
  # is `<ULID>.zst`, one file per unique sha256 (file_blobs row).
  files_cold_data:
  hermes_data:
  # Sealed builder runtime workspace — used by the codex-builder Hermes
  # profile only. Owned uid 10001 mode 0700 by the init container (PR 4).
  # See docs/codex-builder-runtime.md §5.
  hermes_codex_work:
  alfred_data:
  temporal_data:
  ollama_data:
  web_db_data:
  caddy_data:
  caddy_config:
  vaultwarden_data:
  mcp_server_data:
  state_data:
  ingest_data:
  cold_data:
  plane_pgdata:
  plane_redis:
  plane_rabbitmq:
  plane_uploads:
  sure_pgdata:
  sure_redis:
  paperclip_data:
  # Tailscale sidecar state — node key in tailscaled.state survives
  # `docker compose pull/up/restart`. Issue #109 PR 1. See §3.5 of
  # docs/specs/issue-109-tailscale-via-ui.md.
  tailscale_data:
