name: Push OpenClaw config to tenants

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload scripts to control plane
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/push-openclaw-config.mjs \
            scripts/deep-merge-config.py \
            deploy@${{ secrets.DEPLOY_HOST }}:/tmp/

      - name: Push config to all tenants
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy@${{ secrets.DEPLOY_HOST }} \
            "MERGE_SCRIPT=/tmp/deep-merge-config.py node --experimental-sqlite /tmp/push-openclaw-config.mjs"
