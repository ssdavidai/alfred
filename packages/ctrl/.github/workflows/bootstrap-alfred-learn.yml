name: Bootstrap alfred-learn on all tenants

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bootstrap-alfred-learn.mjs'
      - '.github/workflows/bootstrap-alfred-learn.yml'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload bootstrap script to control plane
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/bootstrap-alfred-learn.mjs \
            deploy@${{ secrets.DEPLOY_HOST }}:/tmp/bootstrap-alfred-learn.mjs

      - name: Run bootstrap on control plane
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deploy@${{ secrets.DEPLOY_HOST }} \
            "node --experimental-sqlite /tmp/bootstrap-alfred-learn.mjs"
