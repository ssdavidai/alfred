[pytest]
asyncio_mode = auto
# auto-mode means any `async def test_*` is automatically treated as an
# asyncio test without needing per-function @pytest.mark.asyncio
# decorators. Matches the behaviour the asyncio test files in this
# package already assume (and CI was missing pytest-asyncio entirely
# pre-#522, so builds failed silently on any async test).

markers =
    slow: marks tests as slow (LLM-backed regression suite, etc.); deselect with -m "not slow"
