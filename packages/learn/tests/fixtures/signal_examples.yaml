# Phase 6.7 regression fixture for the signal extractor.
#
# 100 hand-crafted stream-event examples grounded in real shapes from
# the owner's vault (under /mnt/encrypted/vault/stream_event/) and a few
# synthetic edge cases. Each example carries:
#
#   id, description, stream_event_frontmatter, stream_event_body,
#   expected.{should_produce_signal, effect, target_kind,
#             target_path_contains, mutation_decision,
#             target_confidence_min, effect_confidence_min, notes}
#
# Distribution (positives first, then negatives):
#
#   POSITIVES (60)
#     gmail            10   (ex_001..ex_010)
#     slack             8   (ex_011..ex_018)
#     omi               6   (ex_019..ex_024)
#     openclaw-chat     8   (ex_025..ex_032)
#     vexa              6   (ex_033..ex_038)
#     sure              6   (ex_039..ex_044)
#     gcal              6   (ex_045..ex_050)
#     plane             6   (ex_051..ex_056)
#     vault_edit        4   (ex_057..ex_060)
#
#   NEGATIVES (40)
#     newsletters       8   (ex_061..ex_068)
#     questions         4   (ex_069..ex_072)
#     hypotheticals     4   (ex_073..ex_076)
#     narrations        5   (ex_077..ex_081)
#     auto-replies      3   (ex_082..ex_084)
#     domestic-chatter  3   (ex_085..ex_087)
#     short/empty       3   (ex_088..ex_090)
#     informational     5   (ex_091..ex_095)
#     gcal-noise        2   (ex_096..ex_097)
#     plane-self-echo   3   (ex_098..ex_100)
#
# Synthetic-vs-real:
#   Most positives are derived from real owner records (shape, sender
#   patterns, language); a handful (vexa, sure, vault_edit) are
#   plausible-construction because the owner has no live records on those
#   source types yet — those are flagged with synthetic: true.
#
# Schema rules every fixture follows:
#   - should_produce_signal: bool. True when the LLM output's effect is
#     "mutation" or "action". False when effect == "none".
#   - effect: "mutation" | "action" | "none".
#   - target_kind: "task" | "matter" | null.
#   - target_path_contains: list[str] of substring hints — at least one
#     must appear in the resolved target_path. null when no specific
#     target is expected.
#   - mutation_decision: substring hint into mutation_proposal.decision
#     when effect=mutation; null otherwise.
#   - target_confidence_min / effect_confidence_min: floats; the
#     extractor's stamped values must be >= these.
#   - notes: human-readable note explaining the case (also surfaced in
#     test failure output).

