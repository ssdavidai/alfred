server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed Vite bundles — safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback — client-side routes (/desk, /login, …) all
    # resolve to index.html; React Router takes it from there.
    location / {
        try_files $uri /index.html;
    }
}
