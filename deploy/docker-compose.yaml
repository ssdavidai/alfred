services:
  postgres:
    image: postgres:16.6-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: alfred_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: alfred-saas:latest
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.server
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./alfred-ctrl:/app/alfred-ctrl

  # --- AgentPhone Voice Bridge (Twilio Media Streams ↔ OpenAI Realtime) ---
  voice-bridge:
    image: ssdavidai00/alfred-voice-bridge:latest
    restart: always
    env_file:
      - .env.server
    environment:
      VOICE_BRIDGE_PORT: "9000"
      SAAS_INTERNAL_URL: "https://alfred.black"
    ports:
      - "127.0.0.1:9000:9000"

  # --- Plausible Analytics CE ---
  plausible_db:
    image: postgres:16.6-alpine
    restart: always
    volumes:
      - plausible_db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      start_period: 1m

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: always
    volumes:
      - plausible_events_data:/var/lib/clickhouse
      - plausible_events_logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      start_period: 1m

  plausible:
    image: ghcr.io/plausible/community-edition:v3.2.0
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - plausible_data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${PLAUSIBLE_BASE_URL:-http://localhost:8000}
      - SECRET_KEY_BASE=${PLAUSIBLE_SECRET_KEY_BASE}
      - TOTP_VAULT_KEY=${PLAUSIBLE_TOTP_VAULT_KEY}
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db
      - DISABLE_REGISTRATION=invite_only
      - HTTP_PORT=8000

volumes:
  postgres_data:
  plausible_db_data:
  plausible_events_data:
  plausible_events_logs:
  plausible_data:
