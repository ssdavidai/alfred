name: Deploy alfred-learn to existing tenants

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy alfred-learn to all running tenants
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} << 'REMOTE'
            set -e
            cd /opt/alfred-saas/alfred-ctrl
            
            # Get tenant IPs and SSH keys from the DB
            node -e "
              const db = require('./dist/db/queries.js');
              const instances = db.getAllInstances().filter(i => i.status === 'running' && i.ip_address);
              instances.forEach(i => {
                console.log(i.ip_address + ' ' + i.ssh_key_path);
              });
            " | while read ip keypath; do
              echo "=== Deploying to $ip ==="
              ssh -i "$keypath" -o StrictHostKeyChecking=no deploy@"$ip" \
                "cd /opt/alfred && docker compose pull alfred-learn 2>/dev/null; docker compose up -d alfred-learn --no-recreate 2>&1 || docker compose up -d alfred-learn 2>&1" || echo "FAILED: $ip"
            done
          REMOTE
