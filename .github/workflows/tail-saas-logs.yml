name: Tail SaaS logs
on: workflow_dispatch
jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/k && chmod 600 ~/.ssh/k
      - run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/k deploy@${{ secrets.DEPLOY_HOST }} \
            'docker logs --since 10m alfred-saas-app-1 2>&1 | grep -iE "agentmail|webhook|/webhooks|svix|inbox" | tail -40'
