# Detect fleet drift. REPORTS, never deploys.
#
# Why this exists
# ---------------
# Image rollout is deliberately narrow: deploy-fleet ships only to the canary
# (ALFRED_FLEET_HOSTS, default `home`) so a bad merge cannot reach a client
# tenant on its own. That is the right default. But narrow rollout with no
# detection means every other tenant rots silently, and on 2026-08-17 we found
# out how far it had gone:
#
#   * one tenant appeared in NO workflow and had received nothing for a month.
#     Its compose still carried a caddy healthcheck removed weeks earlier,
#     leaking one PID slot per probe.
#   * another was in the config-sync list but no image rollout ever reached it.
#   * four tenants had been restarting their hermes container every ~3 minutes
#     for TEN DAYS — 4,600-5,700 restarts each — and nothing said a word.
#
# None of it was hard to find. Nothing was looking. This job looks, daily, and
# fails loudly when a tenant has fallen behind; notify-telegram picks the
# failure up, so drift reaches Sir instead of waiting to be stumbled over.
#
# Strictly read-only. Fixing drift stays a deliberate human act.
name: fleet-drift

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The fleet list lives in the ALFRED_FLEET_HOSTS repo secret, never in a
  # tracked file: this repository is public and tenant hostnames identify
  # clients. Jobs fan out over indices so no hostname reaches a job name.
  hosts:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.read.outputs.indices }}
    steps:
      - id: read
        env:
          FLEET_HOSTS: ${{ secrets.ALFRED_FLEET_HOSTS }}
        run: |
          set -euo pipefail
          n=$(printf '%s\n' "$FLEET_HOSTS" | grep -cE '[^[:space:]]' || true)
          if [ "${n:-0}" -lt 1 ]; then
            echo "FAIL: ALFRED_FLEET_HOSTS is empty or unset." >&2
            exit 1
          fi
          indices=$(seq 0 $((n - 1)) | jq -R 'tonumber' | jq -sc .)
          echo "indices=$indices" >> "$GITHUB_OUTPUT"
          echo "Fleet: ${n} tenants" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: hosts
    runs-on: ubuntu-latest
    strategy:
      # One drifted tenant must not hide the state of the others.
      fail-fast: false
      matrix:
        index: ${{ fromJSON(needs.hosts.outputs.indices) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/fleet-host
        with:
          hosts: ${{ secrets.ALFRED_FLEET_HOSTS }}
          index: ${{ matrix.index }}

      - uses: ./.github/actions/fleet-ssh
        with:
          key: ${{ secrets.FLEET_SSH_KEY }}

      - name: Check tenant #${{ matrix.index }}
        run: |
          set -uo pipefail
          host="$HOST"

          if ! ssh -o BatchMode=yes "$host" 'echo ok' >/dev/null 2>&1; then
            echo "### :x: tenant #${{ matrix.index }} — UNREACHABLE" >> "$GITHUB_STEP_SUMMARY"
            echo "tenant #${{ matrix.index }} unreachable" >&2
            exit 1
          fi

          report=$(ssh -o BatchMode=yes "$host" 'bash -s' < .github/scripts/tenant-drift-check.sh 2>&1)
          rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "### :white_check_mark: tenant #${{ matrix.index }} — clean" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### :warning: tenant #${{ matrix.index }} — DRIFT"
              echo '```'
              echo "$report"
              echo '```'
              echo "Resolve the host from the ALFRED_FLEET_HOSTS secret, then: \`docker compose pull && docker compose up -d\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "$report"
          exit "$rc"
