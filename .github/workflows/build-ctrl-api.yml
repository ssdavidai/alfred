# Build + push the alfred-ctrl-api image (the dashboard backend / tenant API).
#
# Dockerfile: packages/ctrl/Dockerfile — esbuild bundles dist/api.mjs onto
# node:22-slim with the docker CLI baked in (ctrl-api restarts sibling
# containers via the mounted docker socket).
name: build-ctrl-api

on:
  push:
    branches: [main]
    paths:
      - "packages/ctrl/**"
      - ".github/workflows/build-ctrl-api.yml"
  workflow_dispatch:

concurrency:
  group: build-ctrl-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/ctrl
          file: packages/ctrl/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ssdavidai00/alfred-ctrl-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
