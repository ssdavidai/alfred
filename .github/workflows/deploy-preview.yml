name: Deploy Preview (staging)
on:
  push:
    branches: [main]
    paths:
      - 'packages/saas/**'
      - 'packages/ctrl/**'
      - 'deploy/**'
      - '.github/workflows/deploy-preview.yml'
  workflow_dispatch:
concurrency:
  group: deploy-preview
  cancel-in-progress: false

# Preview deployment for preview.alfred.black. Mirrors deploy-saas.yml in
# build shape but the runtime topology on the preview VM is different from
# prod: systemd `alfred-saas.service` + native PostgreSQL (not docker
# compose). The two safety belts in `.env.server` stay in place:
#   WASP_DISABLE_JOBS=true            → all PgBoss workers short-circuit
#   WRITE_BLOCK_TENANT_OPS_DENYLIST=… → refuses non-GET proxyToTenant
#                                       calls for the four prod tenants
# These keep preview a read-only mirror of prod data; do NOT remove them.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wasp CLI
        run: curl -sSL https://get.wasp.sh/installer.sh | sh -s -- -v 0.19.1
        env:
          WASP_TELEMETRY_DISABLED: 1

      - name: Build Wasp app
        run: cd packages/saas/app && ~/.local/bin/wasp build

      - name: Patch npm overrides into Wasp build
        run: |
          cd packages/saas/app/.wasp/build
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.overrides = { ...pkg.overrides, 'three': '0.175.0' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install build dependencies
        run: cd packages/saas/app/.wasp/build && npm install

      - name: Patch Prisma to use db push (no migration files in this project)
        run: |
          cd packages/saas/app/.wasp/build/server
          sed -i 's/"db-migrate-prod": "prisma migrate deploy --schema=..\/db\/schema.prisma"/"db-migrate-prod": "prisma db push --schema=..\/db\/schema.prisma --skip-generate --accept-data-loss"/' package.json

      - name: Build web-app client
        run: cd packages/saas/app/.wasp/build/web-app && REACT_APP_API_URL=https://preview.alfred.black npx vite build

      - name: Build server bundle
        # Preview runs the bundled server.js directly under systemd (no
        # Docker), so we have to produce bundle/server.js here on the
        # runner where the Wasp-generated tsconfig path layout
        # (`../../../tsconfig.json`) resolves correctly.
        run: cd packages/saas/app/.wasp/build/server && npm run bundle

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PREVIEW_SSH_KEY }}" > ~/.ssh/preview_key
          chmod 600 ~/.ssh/preview_key
          # PREVIEW_HOST may be Tailscale-only and unresolvable from the
          # GH runner; rely on accept-new in the rsync/ssh steps below.
          ssh-keyscan -H ${{ secrets.PREVIEW_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy server build to preview VM
        # Preview's runtime layout is /opt/alfred-saas/{server,sdk,db,client}
        # — no docker, no /opt/alfred-saas/wasp-build/ staging dir. Exclude
        # node_modules (host has its own Linux native node_modules; preview's
        # `npm install` step below refreshes them in place) and the wasp
        # checksums file.
        run: |
          rsync -azP --delete \
            --exclude='node_modules/' \
            --exclude='.waspchecksums' \
            -e "ssh -i ~/.ssh/preview_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            packages/saas/app/.wasp/build/server/ \
            deploy@${{ secrets.PREVIEW_HOST }}:/opt/alfred-saas/server/

      - name: Deploy SDK + db schema to preview VM
        run: |
          rsync -azP --delete \
            -e "ssh -i ~/.ssh/preview_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            packages/saas/app/.wasp/build/sdk/ \
            deploy@${{ secrets.PREVIEW_HOST }}:/opt/alfred-saas/sdk/
          rsync -azP --delete \
            -e "ssh -i ~/.ssh/preview_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            packages/saas/app/.wasp/build/db/ \
            deploy@${{ secrets.PREVIEW_HOST }}:/opt/alfred-saas/db/

      - name: Deploy client to preview VM
        run: |
          rsync -azP --delete \
            -e "ssh -i ~/.ssh/preview_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            packages/saas/app/.wasp/build/web-app/build/ \
            deploy@${{ secrets.PREVIEW_HOST }}:/opt/alfred-saas/client/

      - name: Set preview-mode env vars on Wasp service
        run: |
          ssh -i ~/.ssh/preview_key deploy@${{ secrets.PREVIEW_HOST }} '
            ENV_FILE="/opt/alfred-saas/.env.server"
            touch "$ENV_FILE"

            # WASP_DISABLE_JOBS — short-circuit every PgBoss worker.
            if grep -q "^WASP_DISABLE_JOBS=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^WASP_DISABLE_JOBS=.*|WASP_DISABLE_JOBS=true|" "$ENV_FILE"
            else
              echo "WASP_DISABLE_JOBS=true" >> "$ENV_FILE"
            fi

            # WRITE_BLOCK_TENANT_OPS_DENYLIST — refuse non-GET proxyToTenant
            # calls for the four prod tenant tailscale hostnames.
            DENYLIST="alfred-alfred-david-mnbqn4jg,alfred-alfred-rapali-zsolt-mnczdq7a,alfred-alfred-miguel-mnd9thwe,alfred-alfred-raj313-mogta4ad"
            if grep -q "^WRITE_BLOCK_TENANT_OPS_DENYLIST=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^WRITE_BLOCK_TENANT_OPS_DENYLIST=.*|WRITE_BLOCK_TENANT_OPS_DENYLIST=$DENYLIST|" "$ENV_FILE"
            else
              echo "WRITE_BLOCK_TENANT_OPS_DENYLIST=$DENYLIST" >> "$ENV_FILE"
            fi

            # WASP_WEB_CLIENT_URL / WASP_SERVER_URL for the preview domain.
            if grep -q "^WASP_WEB_CLIENT_URL=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^WASP_WEB_CLIENT_URL=.*|WASP_WEB_CLIENT_URL=https://preview.alfred.black|" "$ENV_FILE"
            else
              echo "WASP_WEB_CLIENT_URL=https://preview.alfred.black" >> "$ENV_FILE"
            fi
            if grep -q "^WASP_SERVER_URL=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^WASP_SERVER_URL=.*|WASP_SERVER_URL=https://preview.alfred.black|" "$ENV_FILE"
            else
              echo "WASP_SERVER_URL=https://preview.alfred.black" >> "$ENV_FILE"
            fi

            echo "Preview env applied:"
            grep -E "^(WASP_DISABLE_JOBS|WRITE_BLOCK_TENANT_OPS_DENYLIST|WASP_WEB_CLIENT_URL|WASP_SERVER_URL)=" "$ENV_FILE"
          '

      - name: npm install + prisma push + systemctl restart
        # Preview's `app` runs as systemd, not docker. Run prisma push
        # natively against host Postgres (DATABASE_URL on preview points
        # at localhost:5432, which works on the host but never from
        # inside a `docker compose run` container — that's why the
        # previous docker-compose-based version of this workflow had
        # been failing silently for days).
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 \
              -i ~/.ssh/preview_key deploy@${{ secrets.PREVIEW_HOST }} '
            set -e
            cd /opt/alfred-saas/server

            echo "=== npm install (server) ==="
            npm install --no-audit --no-fund 2>&1 | tail -3

            echo "=== prisma db push (native, against host Postgres) ==="
            set -a; source /opt/alfred-saas/.env.server; set +a
            for attempt in 1 2 3; do
              if npx prisma db push --schema=../db/schema.prisma --skip-generate --accept-data-loss; then
                echo "prisma db push succeeded (attempt $attempt)"
                break
              fi
              if [ "$attempt" -eq 3 ]; then echo "prisma db push failed after 3 attempts" >&2; exit 1; fi
              echo "prisma db push failed (attempt $attempt), retrying in 10s..."
              sleep 10
            done

            echo "=== restart alfred-saas.service ==="
            sudo systemctl restart alfred-saas.service
            sleep 5
            systemctl is-active alfred-saas.service
            echo "Preview Wasp app restarted"
          '

      - name: Update Caddy on preview host
        # Use the preview-specific Caddyfile. The earlier version of this
        # step copied `deploy/Caddyfile` (the prod one), which has no
        # `preview.alfred.black` block and instead has `alfred.black` +
        # `app.alfred.black` + others — Caddy on preview then tried to
        # ACME-provision certs for prod-only domains that don't resolve
        # to preview's IP, and broke TLS for preview.alfred.black with CF
        # error 525. Always use `deploy/Caddyfile.preview` here.
        run: |
          scp -i ~/.ssh/preview_key deploy/Caddyfile.preview deploy@${{ secrets.PREVIEW_HOST }}:/tmp/Caddyfile
          ssh -i ~/.ssh/preview_key deploy@${{ secrets.PREVIEW_HOST }} '
            sudo cp /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak-$(date +%s)
            sudo cp /tmp/Caddyfile /etc/caddy/Caddyfile
            sudo caddy validate --config /etc/caddy/Caddyfile
            sudo systemctl reload caddy
            rm /tmp/Caddyfile
            echo "Caddy reloaded with preview-specific config"
          '

      - name: Purge Cloudflare cache for preview.alfred.black
        # Vite emits new asset hashes on every build; without a purge,
        # users on the edge see stale HTML pointing at hash bundles that
        # no longer exist (404). Same pattern as the prod cutover.
        env:
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID_ALFRED_BLACK }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE_ID" ] || [ -z "$CF_API_TOKEN" ]; then
            echo "Cloudflare secrets not set — skipping cache purge (manual purge recommended)"
            exit 0
          fi
          curl -sS -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            | tee /tmp/cf_purge.json
          grep -q '"success":true' /tmp/cf_purge.json

      - name: Verify preview deployment
        run: |
          sleep 5
          STATUS=$(ssh -i ~/.ssh/preview_key deploy@${{ secrets.PREVIEW_HOST }} \
            'curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/auth/me')
          echo "Preview health check status: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]
