# Lint + type-check + test gate for alfred-black.
#
#   * esbuild bundle     — packages/ctrl (dist/api.mjs compiles)
#   * pytest             — packages/learn
#   * docker compose config — the root compose file parses clean
#   * shellcheck         — scripts/bootstrap.sh
#
# Runs on every PR and on push to main. Does NOT build or deploy images
# (that is the build-*.yml workflows' job). The Wasp web app is type-checked
# by build-web.yml's `wasp build` — bare `tsc` cannot resolve the generated
# `wasp/*` modules without Wasp codegen, so it is not checked here.
name: ci-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-naming-guard:
    # Cheap fail-fast guard against the glob-escape bug PR #133 fixed: the
    # ctrl/web test runners glob `tests/*.test.ts` (suffix convention). A file
    # named `test_foo.ts` (prefix convention) is silently invisible to the
    # runner — that's how #110 PR1's whole batch of HA-channel tests shipped
    # without running. This step rejects the prefix shape so the regression
    # cannot recur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tests/test_*.ts naming (must be *.test.ts)
        run: |
          bad=$(find packages/ctrl/tests packages/web/src -name 'test_*.ts' -not -name '*.test.ts' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "FAIL — these test files use the prefix-naming convention which the runner glob skips:"
            echo "$bad"
            echo "Rename to *.test.ts (suffix convention) so they actually run."
            exit 1
          fi

  build-ctrl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: packages/ctrl
        run: npm ci
      - name: esbuild bundle (dist/api.mjs)
        # The real compile check — the same bundle the ctrl-api image ships.
        # `tsc --noEmit` is not used: node:sqlite is esbuild-external and has
        # no tsc-resolvable types, so bare tsc reports false positives.
        working-directory: packages/ctrl
        run: node build.mjs

  test-mcp-server:
    # tsc typecheck + node --test for the per-app tool catalogues
    # (alfred / sure / plane / vaultwarden / execute / hermes). The tests are
    # pure schema + buildRequest assertions; no network or env required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: packages/mcp-server
        run: npm ci
      - name: typecheck
        working-directory: packages/mcp-server
        run: npm run typecheck
      - name: node --test
        working-directory: packages/mcp-server
        run: npm test

  test-ctrl:
    # node:test for packages/ctrl — added by #290.
    #
    # Until now `build-ctrl` only ran esbuild, so packages/ctrl/tests/* executed
    # NOWHERE: not in CI, and not locally either (tsx is a devDependency most
    # contributors never install). The suite rotted silently, and on 2026-07-31
    # a PR went green across all 13 checks while carrying a fleet-wide
    # ctrl-api crash-loop that its own committed test would have caught.
    #
    # Two guards, both from #290:
    #   * --test-timeout=120000 — tests/ha_ws_client.test.ts has an un-timed
    #     WebSocket wait that ran 4h39m and killed a build orchestrator.
    #   * tests/.ci-quarantine — the four suites that fail on main today are
    #     excluded so the other ~1200 tests can gate merges. The list is
    #     printed as a warning on every run so it cannot quietly become
    #     permanent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        working-directory: packages/ctrl
        run: npm ci
      - name: Announce quarantine (#290)
        working-directory: packages/ctrl
        run: |
          echo "::warning title=ctrl tests quarantined (#290)::$(grep -vE '^#|^$' tests/.ci-quarantine | paste -sd', ' -)"
      - name: node --test
        working-directory: packages/ctrl
        run: npm run test:ci

  test-voice-bridge:
    # tsc compile + node --test for the OpenAI Realtime session-update race fix.
    # Mock WS server is in-process; no network or OpenAI key needed (a dummy
    # key satisfies config.ts's required-env check).
    #
    # PATH-GATED: this job only does real work when the PR actually changes
    # packages/voice-bridge/**. On PRs that don't touch voice-bridge it
    # short-circuits to green — the test is irrelevant there, and it used to
    # be a recurring false-red (slow-stall) the loop had to hand-wave as a
    # "flake." The job still ALWAYS runs (so it satisfies branch protection /
    # required-check) — it just skips the expensive steps when unchanged.
    # `timeout-minutes` caps the slow-stall so a hung run can't block forever.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Detect voice-bridge changes
        id: vb
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --depth=1 origin "$base" >/dev/null 2>&1 || true
            if git diff --name-only "$base" HEAD 2>/dev/null | grep -q '^packages/voice-bridge/'; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # push to main / manual: always run the real test.
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "voice-bridge changed: $(grep changed= "$GITHUB_OUTPUT" || true)"
      - uses: actions/setup-node@v4
        if: steps.vb.outputs.changed == 'true'
        with:
          node-version: "22"
      - name: Install deps
        if: steps.vb.outputs.changed == 'true'
        working-directory: packages/voice-bridge
        run: npm ci || npm install
      - name: tsc + node --test
        if: steps.vb.outputs.changed == 'true'
        working-directory: packages/voice-bridge
        env:
          OPENAI_API_KEY: sk-ci-dummy
          VOICE_BRIDGE_INTERNAL_TOKEN: ci-dummy-token
        run: npm test
      - name: Skipped (voice-bridge unchanged)
        if: steps.vb.outputs.changed != 'true'
        run: echo "voice-bridge unchanged in this PR — test not applicable, passing."

  pytest-learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: packages/learn
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: pytest
        working-directory: packages/learn
        run: pytest tests/ -v -m "not slow"

  compose-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synthesize a dummy .env
        # docker compose config resolves env_file + ${VAR} interpolation; a
        # placeholder .env lets the parser run without real secrets.
        run: |
          cp .env.example .env
          # Fill required + auto fields with dummy values so interpolation
          # never resolves to empty (compose warns, but config still parses).
          {
            echo "DOMAIN=example.com"
            echo "ACME_EMAIL=ci@example.com"
            echo "OWNER_NAME=CI"
            echo "ANTHROPIC_API_KEY=sk-ci-dummy"
            echo "OPENROUTER_API_KEY=sk-ci-dummy"
            echo "COMPOSIO_API_KEY=ci-dummy"
            for k in AAS_API_KEY COLUMN_ENCRYPTION_KEY JWT_SECRET \
                     HERMES_API_SERVER_KEY WEB_DATABASE_PASSWORD \
                     VAULTWARDEN_ADMIN_TOKEN MCP_APPROVAL_SECRET \
                     DJANGO_SECRET_KEY POSTGRES_PASSWORD REDIS_PASSWORD \
                     MINIO_ROOT_PASSWORD LIVE_SERVER_SECRET_KEY \
                     SURE_SECRET_KEY_BASE SURE_POSTGRES_PASSWORD \
                     SURE_REDIS_PASSWORD; do
              echo "${k}=cidummy0000000000000000000000000000"
            done
          } >> .env
      - name: docker compose config (default profile)
        run: docker compose config --quiet
      - name: docker compose config (tailscale profile — issue #109 PR 1)
        run: docker compose --profile tailscale config --quiet
      - name: tailscale OFF by default (no service unless profile passed)
        # PR 1's acceptance gate: `docker compose up -d` alone must NEVER
        # bring up the tailscale sidecar. Profile gating is the load-bearing
        # contract — if this assertion ever flips, every existing tenant
        # would silently start joining a tailnet on next deploy.
        #
        # DETERMINISTIC CHECK. The old form used `docker compose --profile
        # tailscale config --services | grep`, which flaked: whether
        # profile-gated services appear in `config` output varies by the
        # runner's bundled docker-compose version (a `docker compose config`
        # without the active profile OMITS profile-gated services entirely on
        # recent versions). So it intermittently reported "tailscale missing"
        # on PRs that never touched compose — a false red the loop then
        # hand-waved as a "flake." Instead we parse the RAW docker-compose.yaml
        # and assert the actual contract straight from source: the tailscale
        # service is DECLARED and GATED behind the `tailscale` profile (a
        # profile-gated service never starts on a bare `up -d` — that's the
        # whole guarantee). No docker, no `config` resolution, no env
        # interpolation, no version sensitivity → fully deterministic.
        run: |
          python3 -m pip install --quiet pyyaml || pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open("docker-compose.yaml"))
          svcs = doc.get("services", {})
          ts = svcs.get("tailscale")
          if ts is None:
              sys.exit("FAIL: tailscale service is not declared in docker-compose.yaml.")
          profiles = ts.get("profiles") or []
          if "tailscale" not in profiles:
              sys.exit(f"FAIL: tailscale is not gated behind the 'tailscale' profile (profiles={profiles}) — it would start on a bare `docker compose up -d`.")
          default_services = [n for n, s in svcs.items() if not (s or {}).get("profiles")]
          if "tailscale" in default_services:
              sys.exit("FAIL: tailscale appears in the default (profile-less) set — it would start by default.")
          print(f"OK: tailscale declared + gated behind {profiles}, off by default ({len(default_services)} default services).")
          PY

  bootstrap-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck bootstrap.sh
        run: shellcheck scripts/bootstrap.sh
      - name: shellcheck bootstrap-paperclip.sh
        # The paperclip-init container's entrypoint. Drift breaks the
        # zero-CLI Paperclip seed for every new tenant, so we lint it
        # alongside the host bootstrap script.
        run: shellcheck packages/hermes/init/bootstrap-paperclip.sh

  workflow-lint:
    # actionlint catches the foot-guns we previously discovered the hard way:
    # missing `secrets.` prefix, ill-formed matrix entries, `if:` expressions
    # that always evaluate true, and shell-script syntax in `run:` blocks.
    # We've shipped deploy workflows before that were syntactically valid YAML
    # but broken at expand-time; actionlint is the lightest defence.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -version
      - name: Lint all workflows
        # Lint every workflow; deploy-compose.yml is the immediate reason we
        # added the check, but the project is small enough that the full sweep
        # is free and catches regressions in the build-*.yml family too.
        # We disable actionlint's shellcheck integration here — the
        # bootstrap-lint job already runs shellcheck on the scripts we care
        # about, and the inline `run:` blocks are short and intentional
        # (e.g. `SC2029` for ssh remote-side expansion of $SHA is desired).
        run: ./actionlint -color -shellcheck=
