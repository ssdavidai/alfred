# Release the `alfred-vault` Python package to PyPI.
#
# alfred-vault is the public, pip-installable vault CLI (`pip install
# alfred-vault`, console entry point `alfred`). It is versioned with semver,
# INDEPENDENTLY of the platform's date-based repo releases. Source lives at
# packages/alfred-vault/.
#
# Two ways to release:
#   1. Push a tag `alfred-vault-vX.Y.Z`  → builds + publishes to PyPI.
#   2. Run manually (workflow_dispatch)  → choose `testpypi` (dry-run) or
#      `pypi`. Use `testpypi` to rehearse before cutting the real tag.
#
# Publishing uses PyPI **Trusted Publishing** (OIDC) — no API tokens stored in
# the repo. One-time setup on PyPI / TestPyPI before the first publish:
#   PyPI project `alfred-vault` → Settings → Publishing → add a trusted
#   publisher:  owner = ssdavidai, repo = alfred,
#               workflow = release-alfred-vault.yml,
#               environment = pypi   (and a second one with environment =
#               testpypi on test.pypi.org).
# The `tag-X.Y.Z` of the package version must match pyproject's `version`.
name: release-alfred-vault

on:
  push:
    tags: ["alfred-vault-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

concurrency:
  group: release-alfred-vault-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/alfred-vault

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          rm -rf dist
          python -m build

      - name: Validate metadata + verify bundled data ships in the wheel
        run: |
          twine check dist/*
          whl=$(ls dist/*.whl)
          for d in scaffold skills examples; do
            n=$(unzip -l "$whl" | grep -c "_bundled/$d/")
            echo "_bundled/$d files in wheel: $n"
            [ "$n" -gt 0 ] || { echo "::error::wheel is missing _bundled/$d data"; exit 1; }
          done
          # The console entry point must survive — this is the pip-install
          # continuity contract for existing `alfred-vault` users.
          unzip -p "$whl" "*entry_points.txt" | grep -q "alfred = alfred.cli:main" \
            || { echo "::error::console_scripts entry point 'alfred' missing"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: alfred-vault-dist
          path: packages/alfred-vault/dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alfred-vault-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/alfred-vault-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: alfred-vault-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
