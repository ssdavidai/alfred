name: Deploy MCP Worker

on:
  push:
    branches:
      - main
    paths:
      - 'packages/mcp-worker/**'
      - '.github/workflows/deploy-mcp-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/mcp-worker/package-lock.json

      - name: Install
        working-directory: packages/mcp-worker
        run: npm ci

      - name: Type-check
        working-directory: packages/mcp-worker
        run: npm run typecheck

      - name: Deploy
        working-directory: packages/mcp-worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
