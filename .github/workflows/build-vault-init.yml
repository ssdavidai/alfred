name: Build vault-init image
on:
  push:
    branches: [main]
    paths:
      - 'packages/vault-init/**'
      - '.github/workflows/build-vault-init.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          # bash -n is a parse-only check; catches syntax errors without
          # executing the scripts. Anything more (shellcheck) is overkill
          # for the volume of shell here.
          bash -n packages/vault-init/vault-init.sh
          bash -n packages/vault-init/migrate.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sanity-check Node script
        run: node --check packages/vault-init/bootstrap-signup.mjs

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: packages/vault-init
          file: packages/vault-init/Dockerfile
          push: true
          tags: |
            ssdavidai00/alfred-vault-init:latest
            ssdavidai00/alfred-vault-init:${{ github.sha }}
