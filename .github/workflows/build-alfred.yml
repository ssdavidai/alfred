name: Build & Push Alfred Images (init + worker)

on:
  push:
    branches: [main]
    paths:
      - 'packages/openclaw/init/**'
      - 'packages/openclaw/workspace-template/**'
      - 'packages/openclaw/dockerfiles/alfred.Dockerfile'
      - 'packages/openclaw/config.yaml.tpl'
      - 'packages/openclaw/openclaw-wrapper'
      - 'packages/openclaw/patches/**'
      # MCP-4: init image bundles the mcp-server stdio build, so
      # changes to either trigger a rebuild.
      - 'packages/mcp-server/src/**'
      - 'packages/mcp-server/skills/**'
      - 'packages/mcp-server/instructions/**'
      - 'packages/mcp-server/package.json'
      - 'packages/mcp-server/package-lock.json'
      - 'packages/mcp-server/tsconfig.json'
  workflow_dispatch:

concurrency:
  group: build-alfred
  cancel-in-progress: false

jobs:
  build-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read pinned SHAs from VERSION file
        id: pinned
        run: |
          eval "$(grep -E '^(OPENCLAW_SHA|ALFRED_SHA)=' packages/openclaw/VERSION)"
          echo "alfred_sha=${ALFRED_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push alfred-init image
        uses: docker/build-push-action@v6
        with:
          # MCP-4: context switched from packages/openclaw → . so the
          # Dockerfile's multi-stage mcp-builder can COPY from
          # packages/mcp-server/. All other COPYs in the Dockerfile
          # are now repo-relative (packages/openclaw/init/...).
          context: .
          file: packages/openclaw/init/Dockerfile
          push: true
          build-args: |
            ALFRED_SHA=${{ steps.pinned.outputs.alfred_sha }}
          tags: ssdavidai00/alfred-init:latest
          cache-from: type=gha,scope=alfred-init
          cache-to: type=gha,mode=max,scope=alfred-init
      - name: Smoke — sqlite-vec is bundled (STORE-P3-1)
        # The .so must exist inside the image so entrypoint.sh can stage
        # it onto /alfred-data for ctrl-api to dlopen. If this step ever
        # starts failing the Dockerfile drift is the cause — likely a
        # broken upstream release URL or arch mismatch.
        run: |
          docker run --rm --entrypoint sh ssdavidai00/alfred-init:latest \
            -c 'ls -l /usr/local/lib/sqlite-vec.so && [ -s /usr/local/lib/sqlite-vec.so ]'
      - name: Smoke — token chmod is 0640 (OPS-TOKEN-1)
        # Guards against the failure mode observed in the 11:14Z incident
        # (commit f60cff5 + 41e7db6): an out-of-band push to DockerHub
        # overwrote CI's freshly-built image with stale content where
        # /alfred-data/.gateway-token was chmod 600 — unreadable by
        # alfred-learn (uid 1000) since the token is owned root:1000.
        # alfred-learn cannot read the gateway token → briefs and every
        # other LLM call silently fail. This step pulls the JUST-PUSHED
        # image back from DockerHub (so we observe what tenants will pull,
        # not the local layer cache) and asserts the entrypoint contains
        # the OPS-TOKEN-1 fix and does NOT contain the regressed chmod
        # 600. Failing this step means either CI ran on stale source, or
        # something raced our push and clobbered it — either way the
        # image is bad and the deploy should not proceed.
        run: |
          set -euo pipefail
          docker pull ssdavidai00/alfred-init:latest
          docker run --rm --entrypoint /bin/cat ssdavidai00/alfred-init:latest \
            /setup/entrypoint.sh | tee /tmp/ep.sh > /dev/null
          # grep -F: literal-string match. ``$`` in ``$TOKEN_FILE`` is a
          # regex end-of-line anchor under default grep, so an extended-
          # regex match would always be false even when the line is
          # present. The fixed-string flag is load-bearing — don't drop it.
          if ! grep -qF 'chmod 0640 "$TOKEN_FILE"' /tmp/ep.sh; then
            echo "ERROR: chmod 0640 missing — OPS-TOKEN-1 fix not present in pushed image"
            echo "ERROR: the freshly-pushed ssdavidai00/alfred-init:latest is stale"
            exit 1
          fi
          if grep -qF 'chmod 600 "$TOKEN_FILE"' /tmp/ep.sh; then
            echo "ERROR: chmod 600 present — regressed entrypoint shipped to DockerHub"
            exit 1
          fi
          echo "OK: OPS-TOKEN-1 fix present (chmod 0640) and no regressed chmod 600"

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read pinned SHAs from VERSION file
        id: pinned
        run: |
          eval "$(grep -E '^(OPENCLAW_SHA|ALFRED_SHA)=' packages/openclaw/VERSION)"
          echo "openclaw_sha=${OPENCLAW_SHA}" >> "$GITHUB_OUTPUT"
          echo "alfred_sha=${ALFRED_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push alfred-worker image
        uses: docker/build-push-action@v6
        with:
          context: packages/openclaw
          file: packages/openclaw/dockerfiles/alfred.Dockerfile
          push: true
          build-args: |
            OPENCLAW_SHA=${{ steps.pinned.outputs.openclaw_sha }}
            ALFRED_SHA=${{ steps.pinned.outputs.alfred_sha }}
          tags: ssdavidai00/alfred-worker:latest
          cache-from: type=gha,scope=alfred-worker
          cache-to: type=gha,mode=max,scope=alfred-worker
