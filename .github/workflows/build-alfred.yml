name: Build & Push Alfred Images (init + worker)

on:
  push:
    branches: [main]
    paths:
      - 'packages/openclaw/init/**'
      - 'packages/openclaw/workspace-template/**'
      - 'packages/openclaw/dockerfiles/alfred.Dockerfile'
      - 'packages/openclaw/config.yaml.tpl'
      - 'packages/openclaw/openclaw-wrapper'
      - 'packages/openclaw/patches/**'
      # MCP-4: init image bundles the mcp-server stdio build, so
      # changes to either trigger a rebuild.
      - 'packages/mcp-server/src/**'
      - 'packages/mcp-server/skills/**'
      - 'packages/mcp-server/instructions/**'
      - 'packages/mcp-server/package.json'
      - 'packages/mcp-server/package-lock.json'
      - 'packages/mcp-server/tsconfig.json'
  workflow_dispatch:

concurrency:
  group: build-alfred
  cancel-in-progress: false

jobs:
  build-init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read pinned SHAs from VERSION file
        id: pinned
        run: |
          eval "$(grep -E '^(OPENCLAW_SHA|ALFRED_SHA)=' packages/openclaw/VERSION)"
          echo "alfred_sha=${ALFRED_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push alfred-init image
        uses: docker/build-push-action@v6
        with:
          # MCP-4: context switched from packages/openclaw → . so the
          # Dockerfile's multi-stage mcp-builder can COPY from
          # packages/mcp-server/. All other COPYs in the Dockerfile
          # are now repo-relative (packages/openclaw/init/...).
          context: .
          file: packages/openclaw/init/Dockerfile
          push: true
          build-args: |
            ALFRED_SHA=${{ steps.pinned.outputs.alfred_sha }}
          tags: ssdavidai00/alfred-init:latest
          cache-from: type=gha,scope=alfred-init
          cache-to: type=gha,mode=max,scope=alfred-init

  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Read pinned SHAs from VERSION file
        id: pinned
        run: |
          eval "$(grep -E '^(OPENCLAW_SHA|ALFRED_SHA)=' packages/openclaw/VERSION)"
          echo "openclaw_sha=${OPENCLAW_SHA}" >> "$GITHUB_OUTPUT"
          echo "alfred_sha=${ALFRED_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push alfred-worker image
        uses: docker/build-push-action@v6
        with:
          context: packages/openclaw
          file: packages/openclaw/dockerfiles/alfred.Dockerfile
          push: true
          build-args: |
            OPENCLAW_SHA=${{ steps.pinned.outputs.openclaw_sha }}
            ALFRED_SHA=${{ steps.pinned.outputs.alfred_sha }}
          tags: ssdavidai00/alfred-worker:latest
          cache-from: type=gha,scope=alfred-worker
          cache-to: type=gha,mode=max,scope=alfred-worker
