# Build + push the alfred-init image (the one-shot bootstrap container).
#
# Dockerfile: packages/hermes/init/Dockerfile — scaffolds the vault, deploys
# skills + the MCP bundle, renders the Hermes profile configs, and writes
# /alfred-data/.gateway-token. Triggered by changes to the init container or
# anything it bundles (skills / MCP server).
name: build-init

on:
  push:
    branches: [main]
    paths:
      - "packages/hermes/init/**"
      - "packages/hermes/hermes-config.yaml.njk"
      - "packages/hermes/hermes-profile.env.njk"
      - "packages/hermes/mcp/**"
      - "packages/hermes/workspace-template/**"
      - "packages/mcp-server/**"
      - ".github/workflows/build-init.yml"
  workflow_dispatch:

concurrency:
  group: build-init-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # init's Dockerfile is multi-stage and bundles the MCP server, so
          # the build context is the repo root.
          context: .
          file: packages/hermes/init/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ssdavidai00/alfred-init:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
