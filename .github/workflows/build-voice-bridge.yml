name: Build & Push Docker Image (Voice Bridge)

on:
  push:
    branches: [main]
    paths:
      - 'packages/voice-bridge/**'
      - '.github/workflows/build-voice-bridge.yml'
  workflow_dispatch:

concurrency:
  group: build-voice-bridge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: image_tag
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push voice-bridge image
        uses: docker/build-push-action@v6
        with:
          context: packages/voice-bridge
          file: packages/voice-bridge/Dockerfile
          push: true
          tags: |
            ssdavidai00/alfred-voice-bridge:latest
            ssdavidai00/alfred-voice-bridge:sha-${{ steps.image_tag.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
