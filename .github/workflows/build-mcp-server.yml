# Build + push the alfred-mcp-server image (MCP HTTP server for Claude
# Custom Connectors).
#
# Dockerfile: packages/mcp-server/Dockerfile.
name: build-mcp-server

on:
  push:
    branches: [main]
    paths:
      - "packages/mcp-server/**"
      - ".github/workflows/build-mcp-server.yml"
  workflow_dispatch:

concurrency:
  group: build-mcp-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/mcp-server
          file: packages/mcp-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ssdavidai00/alfred-mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
