name: Build & Push Docker Image (OpenClaw)

on:
  push:
    branches: [main]
    paths:
      - 'packages/openclaw/**'
  workflow_dispatch:

concurrency:
  group: build-openclaw
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: image_tag
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Read pinned SHAs from VERSION file
        id: pinned
        run: |
          eval "$(grep -E '^(OPENCLAW_SHA|ALFRED_SHA)=' packages/openclaw/VERSION)"
          echo "openclaw_sha=${OPENCLAW_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push openclaw image
        uses: docker/build-push-action@v6
        with:
          context: packages/openclaw
          file: packages/openclaw/dockerfiles/openclaw.Dockerfile
          push: true
          build-args: |
            OPENCLAW_SHA=${{ steps.pinned.outputs.openclaw_sha }}
          tags: |
            ssdavidai00/alfred-openclaw:latest
            ssdavidai00/alfred-openclaw:sha-${{ steps.image_tag.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger fleet rollout
        continue-on-error: true
        run: |
          curl -f -X POST https://alfred.black/api/internal/fleet-update \
            -H "Authorization: Bearer ${{ secrets.FLEET_UPDATE_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120 || echo "Fleet rollout endpoint not available (non-fatal)"
