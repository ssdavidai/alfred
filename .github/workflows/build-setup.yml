# Build + push the alfred-setup image (the interactive onboarding wizard).
#
# Dockerfile: packages/setup/Dockerfile. Run on the host via ./scripts/setup.sh,
# which pulls this image and bind-mounts the repo at /work.
name: build-setup

on:
  push:
    branches: [main]
    paths:
      - "packages/setup/**"
      - ".github/workflows/build-setup.yml"
  workflow_dispatch:

concurrency:
  group: build-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/setup
          file: packages/setup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ssdavidai00/alfred-setup:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
