name: omi-pilot-images
on:
  push:
    branches: [codex/omi-native-pilot]
    paths: [packages/ctrl/**, packages/mcp-server/**, packages/learn/**, .github/workflows/omi-pilot-images.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ctrl
            image: alfred-ctrl-api
          - package: mcp-server
            image: alfred-mcp-server
          - package: learn
            image: alfred-learn
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: packages/${{ matrix.package }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:omi-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Record immutable candidate
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
          cat image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: omi-${{ matrix.package }}-digest
          path: image-digest.txt
