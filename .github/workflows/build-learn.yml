name: Build and Push Docker Image (Learn)

on:
  push:
    branches: [main]
    paths:
      - 'packages/learn/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/learn/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r packages/learn/requirements.txt
          pip install pytest pytest-asyncio

      - name: Static check — every execute_activity target is registered
        # Catches the JudgmentWorkflow bug class: a workflow.execute_activity
        # call whose target isn't decorated with @activity.defn or isn't
        # included in ALL_ACTIVITIES. Such a workflow wedges on
        # WORKFLOW_TASK_FAILED at runtime and retries forever. See the script
        # header for the 2026-05-19 incident write-up.
        run: python -m scripts.check_activity_registration
        env:
          PYTHONPATH: packages/learn
        working-directory: packages/learn

      - name: Run tests
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: packages/learn
        working-directory: packages/learn

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: packages/learn
          push: true
          tags: |
            ssdavidai00/alfred-learn:latest
            ssdavidai00/alfred-learn:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Roll out to running tenants
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} \
            'cd /opt/alfred-saas/alfred-ctrl && node --experimental-sqlite dist/index.mjs update --all'

      - name: Build (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: packages/learn
          push: false
          tags: ssdavidai00/alfred-learn:pr-${{ github.event.number }}
