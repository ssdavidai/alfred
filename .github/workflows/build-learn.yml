# Build + push the alfred-learn image (the Temporal intelligence worker).
#
# Dockerfile: packages/learn/Dockerfile.
name: build-learn

on:
  push:
    branches: [main]
    paths:
      - "packages/learn/**"
      - ".github/workflows/build-learn.yml"
  workflow_dispatch:

concurrency:
  group: build-learn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: packages/learn
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: pytest
        working-directory: packages/learn
        run: pytest tests/ -v -m "not slow"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/learn
          file: packages/learn/Dockerfile
          platforms: linux/amd64,linux/arm64
          # build always (verifies the Dockerfile in CI); push only when
          # the DOCKERHUB_TOKEN repo secret is configured.
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: ssdavidai00/alfred-learn:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
