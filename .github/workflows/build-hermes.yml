# Build + push the alfred-black-hermes image (the single AI runtime).
#
# Dockerfile: packages/hermes/Dockerfile — python:3.12-slim + Node 22, the
# pinned NousResearch/hermes-agent install, the baked MCP bundle, skills, and
# a supervised entrypoint launching `hermes -p main gateway`,
# `hermes -p workers gateway`, and one hermes-shim per profile.
name: build-hermes

on:
  push:
    branches: [main]
    paths:
      # Real build inputs under the hermes package. Top-level docs/examples
      # (README.md, CONTRACT.md, MODELS.md, the dev-only docker-compose.yml)
      # are NOT baked into the image, so editing/deleting one shouldn't kick
      # off the heavy multi-arch build. SOUL.codex-builder.md IS baked in
      # (Dockerfile COPY), so it's re-included after the *.md exclusion.
      - "packages/hermes/**"
      - "!packages/hermes/*.md"
      - "!packages/hermes/*.yaml"
      - "!packages/hermes/*.yml"
      - "packages/hermes/SOUL.codex-builder.md"
      - ".github/workflows/build-hermes.yml"
  workflow_dispatch:

concurrency:
  group: build-hermes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # repo-root context: the Hermes image bundles the MCP server
          # (packages/mcp-server) alongside packages/hermes.
          context: .
          file: packages/hermes/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ssdavidai00/alfred-black-hermes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
