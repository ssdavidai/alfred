# Build + push the alfred-black-hermes image (the single AI runtime).
#
# Dockerfile: packages/hermes/Dockerfile — python:3.12-slim + Node 22, the
# pinned NousResearch/hermes-agent install, the baked MCP bundle, skills, and
# a supervised entrypoint launching `hermes -p main gateway`,
# `hermes -p workers gateway`, and one hermes-shim per profile.
name: build-hermes

on:
  push:
    branches: [main]
    paths:
      - "packages/hermes/**"
      - ".github/workflows/build-hermes.yml"
  workflow_dispatch:

concurrency:
  group: build-hermes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/hermes
          file: packages/hermes/Dockerfile
          platforms: linux/amd64,linux/arm64
          # build always (verifies the Dockerfile in CI); push only when
          # the DOCKERHUB_TOKEN repo secret is configured.
          push: ${{ secrets.DOCKERHUB_TOKEN != '' }}
          tags: ssdavidai00/alfred-black-hermes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
